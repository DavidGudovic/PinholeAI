# Manual helper for development sessions whose container can't reach CivitAI / Hugging Face:
# fetches GET URLs on a runner and prints the (optionally jq-filtered) responses to the log.
# Read-only: no secrets are used and only civitai.com, civitai.red, huggingface.co and api.github.com are allowed.
name: API probe

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "Space/newline-separated GET URLs (https://civitai.com, https://civitai.red, https://huggingface.co, https://api.github.com only)"
        required: true
        type: string
      jq:
        description: "jq filter applied to each JSON response (default: compact output)"
        required: false
        type: string
        default: "."
      user_agent:
        description: "User-Agent header to send (default: curl's)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch
        env:
          URLS: ${{ inputs.urls }}
          JQ: ${{ inputs.jq }}
          UA: ${{ inputs.user_agent }}
        run: |
          for u in $URLS; do
            case "$u" in
              https://civitai.com/*|https://civitai.red/*|https://huggingface.co/*|https://api.github.com/*) ;;
              *) echo "skip (host not allowed): $u"; continue ;;
            esac
            echo "===== GET $u"
            out=$(mktemp)
            code=$(curl -sS -L --max-time 120 ${UA:+-A "$UA"} -o "$out" -w '%{http_code} in %{time_total}s (connect %{time_connect}s, first byte %{time_starttransfer}s)' "$u" || echo "000")
            echo "HTTP $code"
            if jq -e . "$out" >/dev/null 2>&1; then
              jq -c "${JQ:-.}" "$out" 2>&1 | head -c 60000
            else
              head -c 4000 "$out"
            fi
            echo
          done
