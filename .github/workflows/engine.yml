# Builds Pinhole's patched sd-server and publishes it as its own release in this repo
# (tag `engine-<upstream version>-p<N>`), which config/engine.yaml then pins. Manual only:
# run it when the engine pin or the patch changes, not for every app release.
#
# It checks out official stable-diffusion.cpp at the commit pinned in config/engine.yaml,
# applies engine/sd-cpp/*.patch, builds the variants Pinhole pins plus Linux CUDA, and
# publishes the zips with SHA256SUMS.txt. The web UI is left out (--reject-origin disables
# it anyway). Build flags follow upstream's .github/workflows/build.yml at master-929-3f8527a.
# Not run yet: check the first run against upstream's own job logs.
#
# Cost: the Windows CUDA job is the long one (upstream's takes 1-2 h); private repos bill
# Windows minutes double.

name: Engine

on:
  workflow_dispatch:
    inputs:
      patch_level:
        description: "Patch release number; bump when only the patch changes (tag engine-<version>-p<N>)"
        required: true
        default: "1"
      draft:
        description: "Create the release as a draft"
        type: boolean
        default: true

permissions:
  contents: write

env:
  UPSTREAM: leejet/stable-diffusion.cpp
  COMMON_FLAGS: -DGGML_NATIVE=OFF -DSD_BUILD_SHARED_LIBS=ON -DSD_BUILD_SHARED_GGML_LIB=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DSD_SERVER_BUILD_FRONTEND=OFF

jobs:
  pin:
    runs-on: ubuntu-24.04
    outputs:
      commit: ${{ steps.pin.outputs.commit }}
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pin from config/engine.yaml
        id: pin
        run: |
          block=$(sed -n '/^stable_diffusion_cpp:/,/^[^ #]/p' config/engine.yaml)
          version=$(printf '%s\n' "$block" | sed -n 's/^  version: *//p' | head -1)
          commit=$(printf '%s\n' "$block" | sed -n 's/^  commit: *//p' | head -1)
          test -n "$version" && test -n "$commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "tag=engine-$version-p${{ inputs.patch_level }}" >> "$GITHUB_OUTPUT"

  linux:
    needs: pin
    runs-on: ubuntu-24.04 # glibc 2.39; Pinhole's engine.yaml says min_glibc 2.38
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: cpu
            flags: ""
          - build: vulkan
            flags: -DSD_VULKAN=ON
          # Linux CUDA (upstream ships none). Only recent NVIDIA cards, to keep the
          # download small: 86 = RTX 30xx, 89 = RTX 40xx, 120 = RTX 50xx (Blackwell).
          # Older cards keep using the Vulkan build.
          - build: cuda12
            flags: -DSD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=86;89;120
    steps:
      - uses: actions/checkout@v4
        with:
          path: pinhole
          sparse-checkout: engine/sd-cpp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.pin.outputs.commit }}
          submodules: recursive
          path: src
      - name: Apply Pinhole patches
        working-directory: src
        run: for p in ../pinhole/engine/sd-cpp/*.patch; do git apply --verbose "$p"; done
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip libvulkan-dev glslc spirv-headers
      - name: CUDA toolkit
        if: matrix.build == 'cuda12'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
      - name: Build
        working-directory: src
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ env.COMMON_FLAGS }} ${{ matrix.flags }} \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH='$ORIGIN'
          cmake --build build --config Release -j "$(nproc)"
      - name: Check the patch is in
        run: src/build/bin/sd-server --help | grep -q -- --reject-origin
      - name: Pack
        run: |
          cp src/ggml/LICENSE src/build/bin/ggml.txt
          cp src/LICENSE src/build/bin/stable-diffusion.cpp.txt
          zip -j "sd-${{ needs.pin.outputs.tag }}-bin-Linux-Ubuntu-24.04-x86_64-${{ matrix.build }}.zip" src/build/bin/*
      - name: Pack CUDA runtime (next to sd-server, like upstream's Windows cudart zip)
        if: matrix.build == 'cuda12'
        run: |
          mkdir cudart
          cp -L "$CUDA_PATH"/lib64/libcudart.so.12 "$CUDA_PATH"/lib64/libcublas.so.12 "$CUDA_PATH"/lib64/libcublasLt.so.12 cudart/
          zip -j "cudart-sd-bin-Linux-Ubuntu-24.04-x86_64-cu12.zip" cudart/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.build }}
          path: "*.zip"

  windows:
    needs: pin
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.4.328.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: cpu
            flags: ""
          - build: vulkan
            flags: -DSD_VULKAN=ON
          # Same architectures as upstream's Windows CUDA build (GTX 10xx and newer).
          - build: cuda12
            flags: -DSD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES='61;70;75;80;86;89;90;100;120' -DCMAKE_CUDA_FLAGS='-Xcudafe "--diag_suppress=177" -Xcudafe "--diag_suppress=550"'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pinhole
          sparse-checkout: engine/sd-cpp
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ needs.pin.outputs.commit }}
          submodules: recursive
          path: src
      - name: Apply Pinhole patches
        working-directory: src
        shell: bash
        run: for p in ../pinhole/engine/sd-cpp/*.patch; do git apply --verbose "$p"; done
      - name: CUDA toolkit
        id: cuda-toolkit
        if: matrix.build == 'cuda12'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - name: Vulkan SDK
        if: matrix.build == 'vulkan'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        working-directory: src
        run: |
          cmake -B build -DCMAKE_CXX_FLAGS='/bigobj' -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_BUILD_TYPE=Release ${{ env.COMMON_FLAGS }} ${{ matrix.flags }}
          cmake --build build
      - name: Check the patch is in
        shell: bash
        run: src/build/bin/sd-server.exe --help | grep -q -- --reject-origin
      - name: Pack
        run: |
          Copy-Item src/ggml/LICENSE src/build/bin/ggml.txt
          Copy-Item src/LICENSE src/build/bin/stable-diffusion.cpp.txt
          7z a "sd-${{ needs.pin.outputs.tag }}-bin-win-${{ matrix.build }}-x64.zip" .\src\build\bin\*
      - name: Pack CUDA runtime
        if: matrix.build == 'cuda12'
        run: |
          robocopy "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin" cudart cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          7z a cudart-sd-bin-win-cu12-x64.zip .\cudart\*
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.build }}
          path: "*.zip"

  release:
    needs: [pin, linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          draft=""
          if [ "${{ inputs.draft }}" = "true" ]; then draft="--draft"; fi
          gh release create "${{ needs.pin.outputs.tag }}" out/* $draft \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Engine ${{ needs.pin.outputs.tag }}" \
            --notes "stable-diffusion.cpp ${{ needs.pin.outputs.commit }} + engine/sd-cpp patches (sd-server --api-key / SD_API_KEY, --reject-origin). Built by the Engine workflow; pinned in config/engine.yaml."
