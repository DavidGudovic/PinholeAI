# Pinhole CI: manual only (Actions → CI → Run workflow). Pushes and PRs no longer run anything,
# so Actions minutes aren't needed to merge: the required pre-merge check is `scripts/check.sh`
# (see README). Use this workflow for what can't run locally:
#   full ......... Windows tests, engine smoke (Linux + Windows), real-app e2e
#   installers ... also build the installers (Windows NSIS + portable zip, Linux AppImage + deb)
# Without "full" it runs the fast tier only (frontend + privacy lint, Rust tests on Linux).
name: CI

on:
  workflow_dispatch:
    inputs:
      full:
        description: "Full checks: Windows tests, engine smoke (Linux + Windows), real-app e2e"
        type: boolean
        default: true
      installers:
        description: "Also build the installers (Windows NSIS + portable zip, Linux AppImage + deb)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  # A newer push supersedes an older run on branches; runs on main always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

# Pinned Rust version. The Rust build cache key includes it (prefix-key below) instead of the
# runner's installed toolchains, which change with every runner image and new Rust release and
# made every installer build compile from scratch. To upgrade: change it in bundle.yml, ci.yml and
# release.yml, then run Bundle on main once so the next release finds a warm cache.
env:
  RUST_TOOLCHAIN: "1.99.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

defaults:
  run:
    shell: bash

jobs:
  # Decides whether the Windows unit tests run. Always on for main and manual "full" runs;
  # on other branches only when the change touches code with Windows-specific behaviour
  # (cfg(windows), process/engine handling, hardware, data dir, updater, the workflows) or
  # the head commit message contains "[windows]".
  plan:
    name: Plan
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.plan.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        env:
          ALWAYS: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.full)) && 'yes' || 'no' }}
        run: |
          win=false
          if [ "$ALWAYS" = yes ]; then
            win=true
          elif ! git fetch --quiet origin main; then
            echo "::warning::could not fetch main, running Windows tests to be safe"
            win=true
          elif git log origin/main..HEAD --format=%B | grep -qiF '[windows]'; then
            win=true
          elif git diff --name-only origin/main...HEAD | grep -qE '^(\.github/workflows/|Cargo\.(toml|lock)$|src-tauri/tauri\.conf\.json$|src-tauri/src/lib\.rs$|src-tauri/crates/pinhole-(engine|hardware|store|net|registry)/|src-tauri/crates/pinhole-core/src/(app|generate|update|downloads|models)\.rs$|tests/)'; then
            win=true
          fi
          echo "windows=$win" >> "$GITHUB_OUTPUT"
          echo "Windows unit tests: $win"

  frontend:
    name: Frontend + privacy lint
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        id: npmci
        run: npm ci

      - name: Unit tests (vitest)
        if: ${{ !cancelled() && steps.npmci.outcome == 'success' }}
        run: npm test -- --passWithNoTests

      - name: Typecheck + build (tsc -b && vite build)
        if: ${{ !cancelled() && steps.npmci.outcome == 'success' }}
        run: npm run build

      - name: Privacy lint self-test (every rule fires on its fixtures)
        if: ${{ !cancelled() }}
        run: node scripts/privacy-lint.mjs --self-test

      - name: Privacy lint
        if: ${{ !cancelled() }}
        run: node scripts/privacy-lint.mjs

  rust:
    name: Rust tests (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        # Windows per the plan job (always on main / manual "full").
        os: ${{ fromJSON(needs.plan.outputs.windows == 'true' && '["ubuntu-22.04","windows-latest"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            libsoup-3.0-dev patchelf libssl-dev libxdo-dev libdbus-1-dev pkg-config \
            build-essential file

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ env.RUST_TOOLCHAIN }}
          add-rust-environment-hash-key: false

      # tauri::generate_context!() embeds ../dist, so the frontend must exist first.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      - name: cargo test --workspace (privacy + offline tests included; smoke test skipped)
        run: cargo test --workspace --locked --no-fail-fast

  bundle:
    name: Installers
    needs: [frontend, rust]
    # Installers only when asked for (manual run with "installers"); releases build their own.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.installers && needs.frontend.result == 'success' && needs.rust.result == 'success' }}
    uses: ./.github/workflows/bundle.yml

  smoke:
    name: Engine smoke test (${{ matrix.os }})
    # Real sd-server + SD 1.5 on CPU, plus the app end-to-end test. Full runs only
    # (push to main / manual "full"). Runs in parallel with the unit tests (it builds
    # what it needs itself) so it no longer waits for them.
    if: >-
      ${{ !cancelled() && (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.full)
      ) }}
    strategy:
      fail-fast: false
      matrix:
        # Upstream Linux sd-server builds are made on Ubuntu 24.04 (glibc 2.38+).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      PINHOLE_SMOKE: "1"
      PINHOLE_SMOKE_CACHE: ${{ github.workspace }}/.smoke-cache
      PINHOLE_SMOKE_OUT: ${{ github.workspace }}/smoke-out
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libssl-dev libdbus-1-dev pkg-config libgomp1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ env.RUST_TOOLCHAIN }}
          add-rust-environment-hash-key: false
          key: smoke

      - name: Smoke cache key
        id: smokekey
        run: node scripts/smoke-cache-key.mjs | tee -a "$GITHUB_OUTPUT"

      - name: Restore engine + model cache
        uses: actions/cache@v4
        with:
          path: .smoke-cache
          key: smoke-${{ runner.os }}-${{ steps.smokekey.outputs.model }}-${{ steps.smokekey.outputs.engine }}
          restore-keys: |
            smoke-${{ runner.os }}-${{ steps.smokekey.outputs.model }}-

      - name: Engine smoke test (256×256, 4 steps, CPU)
        run: cargo test -p pinhole-tests --test engine_smoke --release --locked -- --nocapture

      - name: App end-to-end (engine install → add model → wire → generate → save)
        run: cargo test -p pinhole-tests --test app_e2e --release --locked -- --nocapture

      - name: Upload smoke image
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: smoke-image-${{ runner.os }}
          path: smoke-out/
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: Real-app e2e (WebDriver, Linux)
    if: >-
      ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'workflow_dispatch' && inputs.full) }}
    # upstream Linux sd-server needs glibc 2.38 (Ubuntu 24.04+)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux deps + WebKitWebDriver + Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libssl-dev libxdo-dev \
            libdbus-1-dev pkg-config build-essential libgomp1 webkit2gtk-driver xvfb xdotool
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-rust-${{ env.RUST_TOOLCHAIN }}
          add-rust-environment-hash-key: false
          key: e2e
      - name: Build the app (debug, embedded frontend)
        run: npm ci && npm run build && cargo build -p pinhole --features tauri/custom-protocol --locked
      - name: Install tauri-driver
        run: cargo install tauri-driver --locked
      - name: Real-app e2e (engine download, UI flows, zero-weight SD 1.5 generate + save, privacy scan)
        env:
          PINHOLE_E2E_MODEL: zero
        run: xvfb-run -a -s "-screen 0 1440x960x24" node tests/e2e/run.mjs
      - name: Upload e2e screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: target/e2e/
          retention-days: 7
