[package]
name = "pinhole"
description = "Simple, private, offline AI image generator"
version.workspace = true
edition.workspace = true
license-file.workspace = true
default-run = "pinhole"

[lib]
name = "pinhole_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
pinhole-core = { workspace = true }
pinhole-registry = { workspace = true }
pinhole-net = { workspace = true }
pinhole-store = { workspace = true }
pinhole-hardware = { workspace = true }
pinhole-engine = { workspace = true }
pinhole-catalog = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
parking_lot = { workspace = true }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Globalization"] }
