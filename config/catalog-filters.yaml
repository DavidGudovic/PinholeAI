# Maps the friendly filters in the Models tab to CivitAI API parameters and
# client-side rules (SPEC §5.4). Tune freely; no code changes needed.
# Read by crates/pinhole-catalog (filters.rs).

# "Kind": Models · Style add-ons → `types=` (repeated parameter).
kinds:
  models:       { label: "Models",        api_types: [Checkpoint] }
  style_addons: { label: "Style add-ons", api_types: [LORA] }

# CivitAI model types that are installed as LoRAs (Data/models/loras) when met
# through "Paste from CivitAI" or an install. sd.cpp also loads LyCORIS (LoCon).
lora_types: [LORA, LoCon, DoRA]

# "Look": a model matches if it has ANY of the listed tags (case-insensitive).
# Filtered client-side (the API only takes one `tag`).
looks:
  realistic:
    label: "Realistic"
    tags: [photorealistic, realistic, photography, portraits]
  anime:
    label: "Anime"
    tags: [anime, manga, "2d"]
  illustration:
    label: "Illustration"
    tags: [illustration, cartoon, "digital art", comics, painting]
  three_d:
    label: "3D"
    tags: ["3d", render, "3d render"]
  painting:
    label: "Painting"
    tags: [painting, "oil painting", watercolor, "traditional art", impressionism]
  pixel_art:
    label: "Pixel art"
    tags: ["pixel art", pixelart, "8-bit", "16-bit"]
  line_art:
    label: "Line art"
    tags: [lineart, "line art", sketch, "ink drawing", drawing]
  cinematic:
    label: "Cinematic"
    tags: [cinematic, "film still", movie, "film grain"]
  vintage:
    label: "Vintage"
    tags: [vintage, retro, analog, "analog photography", "film photography"]
  brand:
    label: "Brand & product"
    tags: [product, "product photography", logo, advertising, packaging, commercial]
    also_require:
      allowCommercialUse_includes: Image   # brand work must be usable commercially

style_badges:           # badge shown on model cards, first match wins
  - { look: anime,        badge: "Anime" }
  - { look: realistic,    badge: "Realistic" }
  - { look: three_d,      badge: "3D" }
  - { look: illustration, badge: "Illustration" }

# Paid = the model's newest version is in early access (version
# `availability: EarlyAccess`, or `earlyAccessEndsAt` in the future). Client-side.
price:
  free:      { label: "Free" }
  include:   { label: "Include early access (paid)" }
  paid_only: { label: "Early access only" }
  default: free            # paid models hidden by default

# Safe mode (On/Off). api_nsfw: value of the `nsfw` query parameter (omit the key to not
# send it). What each setting keeps is defined in code:
#   On (safe) → models that pass `safe_filter` below;
#   Off (all) → everything.
# Both ask CivitAI for everything (`nsfw=true`): that is the only way to get every sample
# image with its rating, which `safe_filter` needs (with `nsfw=false` CivitAI drops the
# non-PG images from the response). Switching then reuses the same pages.
content:
  safe: { label: "On",  api_nsfw: true }
  all:  { label: "Off", api_nsfw: true }
  default: safe
  confirm_once_per_session: true
  blur_nsfw_previews_when_safe: true

# "Tags": a multi-select; a model must match EVERY picked tag. Filtered client-side.
# A tag matches when the model has one of `tags` (whole tag, any case), one of `name_words`
# as whole words in its name ("Qwen-Image-Edit" matches `edit`, "Anime Edition" doesn't),
# or a version on one of `base_models` (CivitAI baseModel strings). `api_base_models` (optional)
# also limits the CivitAI request to those base models, so filtering happens server-side.
# `rule: takes_reference` = models that can follow a reference picture (see `reference`).
# `rule: made_for_adults` = exactly the models Safe mode hides; the tag is greyed out while
# Safe mode is on. It has no preset.
# Edit tags/words checked on live /api/v1/models answers (2026-09-28): many Qwen-Image-Edit
# uploads are only tagged "base model", so the name matters most.
tags:
  edit:
    label: "Edit model"
    tags: [edit, "image edit", "image editing", image-edit, image-editing, kontext, "flux kontext",
           qwen-image-edit, qwen-edit, "qwen edit", qwen-image-edit-2509, "qwen edit v2511"]
    name_words: [edit, kontext]
    # Families that also generate but can edit too (models.yaml `modes: [..., edit]`).
    base_models: ["Flux.1 Kontext", "Qwen 2.1", "Flux.2 Klein 4B", "Flux.2 Klein 4B-base",
                  "Flux.2 Klein 9B", "Flux.2 Klein 9B-base", "Flux.2 D"]
    # Sent to CivitAI as `baseModels` (narrowed to what Pinhole runs), so it only pages
    # through models that can be edit models at all.
    api_base_models: ["Qwen", "Qwen 2.1", "Flux.1 Kontext", "Flux.2 Klein 4B", "Flux.2 Klein 4B-base",
                      "Flux.2 Klein 9B", "Flux.2 Klein 9B-base", "Flux.2 D"]
  # Models that can follow a reference picture in Create. Which ones comes from
  # models.yaml (families with both `txt2img` and `edit` in `modes`), not from a list here.
  reference:
    label: "Reference picture"
    rule: takes_reference
  portraits:
    label: "Portraits"
    tags: [portrait, portraits, "portrait photography", headshot]
  characters:
    label: "Characters"
    tags: [character, characters, "game character", "character design"]
  landscapes:
    label: "Landscapes"
    tags: [landscape, landscapes, nature, scenery]
  architecture:
    label: "Architecture"
    tags: [architecture, building, buildings, interior, "interior design"]
  animals:
    label: "Animals"
    tags: [animal, animals, creature, creatures, pets]
  fantasy:
    label: "Fantasy"
    tags: [fantasy, "fantasy art", "dark fantasy"]
  scifi:
    label: "Sci-fi"
    tags: [sci-fi, "science fiction", scifi, cyberpunk, futuristic, space]
  vehicles:
    label: "Vehicles"
    tags: [vehicle, vehicles, car, cars, motorcycle, spaceship, aircraft]
  robots:
    label: "Robots"
    tags: [robot, robots, mecha, android, cyborg]
  food:
    label: "Food"
    tags: [food, "food photography", dessert, drink]
  fashion:
    label: "Fashion"
    tags: [fashion, "fashion design", outfit, "fashion photography"]
  objects:
    label: "Objects"
    tags: [object, objects, item, items, props, "game item"]
  backgrounds:
    label: "Backgrounds"
    tags: [background, backgrounds, wallpaper, environment, "environment art"]
  textures:
    label: "Textures"
    tags: [texture, textures, pattern, patterns, seamless]
  horror:
    label: "Horror"
    tags: [horror, creepy, eerie, "dark art"]
  nsfw:
    label: "NSFW"
    rule: made_for_adults

# "Hide anime" switch in Browse. CivitAI's API can only include one tag, never exclude,
# so this runs client-side (Browse keeps fetching until a page is full). A model is hidden
# when ANY matches: one of these tags (whole tag, any case), a name word, or the newest
# version on one of these base models. Illustrious and NoobAI are anime-native; Pony is not listed
# because it also carries many realistic merges (those are caught by their tags).
hide_anime:
  label: "Hide anime"
  tags: [anime, "anime style", "anime girl", "anime boy", "anime character", "anime screencap",
         manga, "manga style", cartoon, "cartoon style", chibi, waifu, vtuber, donghua]
  name_words: [anime, manga, chibi, waifu, cartoon]
  base_models: [Illustrious, NoobAI]

# Safe mode rules, like Stability Matrix's default (hide what CivitAI flags NSFW, show
# only PG previews) plus our own checks. Tuned on live /api/v1/models data (2026-09-28;
# samples in src-tauri/crates/pinhole-catalog/tests/fixtures/live_*.json). CivitAI's own
# `nsfw=false` only hides models flagged NSFW, which still left many suggestive anime
# merges on the first page. The model-level `nsfwLevel` is a bitmask of every rating its
# images have (1 PG, 2 PG-13, 4 R, 8 X, 16 XXX, 32 blocked): Juggernaut XL is 31 like the
# merges, so it is only used to hide models with no PG image at all. A model is hidden
# when ANY of these match (besides `model.nsfw == true` and a `nsfwLevel` without the PG
# bit, which are always applied):
safe_filter:
  # 1. It has one of these tags (whole tag, any case).
  hide_tags: [
    porn, porno, pornography, hentai, nude, nudes, naked, nudity, sex, sexual, erotic, erotica,
    xxx, yiff, hardcore, lewd, ecchi, fetish, bdsm, bondage, futanari, futa, uncensored, r18,
    breasts, "large breasts", "big breasts", boobs, tits, nipples, "large ass", vagina, penis,
    pussy, genitals, topless, lingerie, underwear, panties, "see-through", bimbo, milf, ntr,
    netorare, ahegao, shemale, "nude girl", "erotic pose", "sex toy", "sexual activity",
    blowjob, cumshot, cum, creampie, bukkake, doggystyle, anal, vulva, labia, lactation,
  ]
  # 2. It has at least `suggestive_tags_to_hide` of these. One alone is not enough (some
  #    general-purpose models carry the nsfw tag).
  suggestive_tags: [
    sexy, nsfw, mature, babes, babe, seductive, seduction, sensual, bikini, swimsuit, busty,
    curvy, pinup, pin-up, thicc, latex, "sexy woman", "sexy girl", "nsfw/sfw", "sfw/nsfw",
  ]
  suggestive_tags_to_hide: 2
  # 3. Its name contains one of these words (whole words, any case: "REED_XXX_SDXL" and
  #    "Mix (NSFW)" match, "XXMix" doesn't). Phrases match consecutive words.
  hide_name_words: [
    nsfw, xxx, porn, porno, hentai, lewd, uncensored, nude, nudes, naked, nudity, erotic,
    erotica, sexy, sex, lust, lustify, harem, babes, bimbo, ntr, milf, fetish, r18, pervert,
    perverts, ahegao, boobs, breasts, tits, hardcore, seductive, onlyfans, "milk factory",
  ]
  # 4. More than this share of its creator's sample images (all versions) are rated R or
  #    above, counted once it has at least `min_rated_images` rated images. Measured:
  #    Juggernaut XL 0.15, majicMIX realistic 0.31, Nova Anime XL 0.43, CyberRealistic Pony
  #    0.49 (kept); RedCraft 0.51, "One obsession" 0.64, "Kodoranime" 0.95 (hidden).
  max_mature_image_share: 0.5
  min_rated_images: 5
  # Card previews with Safe mode on use images rated at most this (1 = PG, like Stability
  # Matrix; capped at 2 = PG-13). A model without one shows no preview.
  max_preview_level: 1

sort:
  - { label: "Most liked",      api: "Most Liked" }
  - { label: "Most downloaded", api: "Most Downloaded" }
  - { label: "Newest",          api: "Newest" }
# Opening sort + time. "Most downloaded · All time" surfaces the mainstream models (Realistic
# Vision, DreamShaper, Juggernaut XL, …); "This month" is dominated by fresh anime merges and
# "This week" returned only 40 checkpoints in total (2026-09-28).
default_sort: "Most Downloaded"
default_period: AllTime

period:
  - { label: "This week",  api: Week }
  - { label: "This month", api: Month }
  - { label: "This year",  api: Year }
  - { label: "All time",   api: AllTime }

allowed_file_formats: [SafeTensor, GGUF]   # never PickleTensor (also enforced in code)
require_scans_success: true                # pickleScanResult and virusScanResult
# Cards per Browse page (the grid asks for the next page while you scroll).
page_size: 24
# Models asked from CivitAI per request (`limit`, max 100; Stability Matrix also asks for
# 50). Bigger than page_size because Safe mode and the other filters drop about half:
# the default query keeps 52 of the first 100. 50 "All time" models are ≈ 6.5 MB of JSON
# (old models have many versions and sample images; sent gzip-compressed) and 3–5 s of
# CivitAI server time (2026-09-28).
api_limit: 50
# When client-side filters drop items, fetch up to this many extra pages per
# scroll before returning a partial page ("Load more").
max_extra_requests: 5
# Recent CivitAI answers are kept in RAM (never on disk) so switching Look, Tags, Price or
# Safe mode back and forth doesn't ask CivitAI again.
cache_minutes: 5
cache_pages: 12
# Card preview images are requested at this width from CivitAI's image CDN, as
# `width=450,optimized=true` — the same small compressed rendition CivitAI's own cards use,
# so it is usually already cached there. Snapped up to the CDN's sizes (96, 320, 450, 512,
# 800, 1200, 1600; max 1800).
preview_width: 450
