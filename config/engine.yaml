# Pinned inference engines (SPEC §2 "Engine binaries"). Nothing here is bundled:
# the matching build is downloaded once (first run) into
#   Data/engine/sd/<version>/<backend>/      (sd-server)
#   Data/engine/llama/<version>/<backend>/   (llama-server, Describe tab only)
# and every archive is SHA-256 verified before it is unpacked or launched.
#
# Machine-readable schema (read by pinhole-engine `pins.rs` and CI `verify-pins`):
#   <engine>.version            release tag the URLs below belong to
#   <engine>.builds.<key>       key = <os>_<backend>, os ∈ windows|linux, backend ∈ cuda|vulkan|cpu
#     .url / .sha256 / .size_bytes / .size_mb   the main archive (.zip or .tar.gz)
#     .extra[]                  more archives unpacked into the SAME folder (e.g. CUDA runtime DLLs)
#   sha256: TODO                allowed while developing; the hash is then computed and recorded,
#                               not enforced. Release builds must have real hashes (CI checks).
#
# Update procedure: bump `version`, rewrite asset names, run the CI "verify pins" job (downloads
# every URL, checks size + SHA-256), then run the engine smoke test (PINHOLE_SMOKE=1).
#
# Verified 2026-09-28: every size + SHA-256 below was checked against the GitHub release
# (downloaded and hashed, and cross-checked with the digests GitHub publishes for the assets).

schema_version: 1

stable_diffusion_cpp:
  repo: https://github.com/leejet/stable-diffusion.cpp
  # Release tag = master-<commit count>-<short sha>. Its server exposes the native async
  # /sdcpp/v1 API (img_gen, jobs, cancel, capabilities, upscale) used by Pinhole.
  version: master-929-3f8527a
  commit: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
  binary: sd-server
  # Added by the engine manager in addition to the per-model wiring args. The port is
  # chosen at launch (random free port on 127.0.0.1). Never listen on 0.0.0.0.
  # --disable-image-metadata: server-wide default off, on top of Pinhole always sending
  # "embed_image_metadata": false per request (defense in depth).
  launch_defaults: ["--listen-ip", "127.0.0.1", "--log-level", "warn", "--disable-image-metadata"]
  builds:
    windows_cuda:
      # CUDA 12.8.1, CMAKE_CUDA_ARCHITECTURES 61;70;75;80;86;89;90;100;120 → includes RTX 50xx
      # (Blackwell, sm_120). Needs an NVIDIA driver with CUDA 12.8 support (570+).
      url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-win-cuda12-x64.zip
      sha256: 217d6dead9abd3f827fc338268555cc179234e7e6330ef21ecb1c985e19d2dc7
      size_bytes: 337915440
      size_mb: 338
      extra:
        # cudart64_12.dll, cublas64_12.dll, cublasLt64_12.dll — must sit next to sd-server.exe.
        - url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/cudart-sd-bin-win-cu12-x64.zip
          sha256: fe20366827d357c00797eebb58244dddab7fd9a348d70090c3871004c320f38d
          size_bytes: 563452046
          size_mb: 563
    windows_vulkan:
      url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-win-vulkan-x64.zip
      sha256: 60e6850d650417409f18c2170ab5e27335db96da70cd3d1ad1e930bcffc2fd35
      size_bytes: 30067605
      size_mb: 30
    windows_cpu:
      url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-win-cpu-x64.zip
      sha256: 5e7caca2080321b25a12c1fa4175cb7d953f2b182309f8f73bfc9c725231d26c
      size_bytes: 17486440
      size_mb: 17
    # No upstream Linux CUDA build: Linux NVIDIA uses Vulkan (see `fallbacks`).
    # Upstream Linux builds are made on Ubuntu 24.04 and need glibc >= 2.38 (Ubuntu 24.04+).
    linux_vulkan:
      url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip
      sha256: e35cc73cf5ba9637d1dc1d717760e7b8428376a4905d57e72ec8c871864f62c7
      size_bytes: 36886217
      size_mb: 37
      min_glibc: "2.38"
    linux_cpu:
      url: https://github.com/leejet/stable-diffusion.cpp/releases/download/master-929-3f8527a/sd-master-3f8527a-bin-Linux-Ubuntu-24.04-x86_64.zip
      sha256: 9ad35ed309dbe59f5e66f35edafac9a69e6cc233ea6b9577071feae829159d37
      size_bytes: 26025088
      size_mb: 26
      min_glibc: "2.38"

llama_cpp:
  repo: https://github.com/ggml-org/llama.cpp
  version: b11235
  commit: 6c7a87f7e5e5cd75b8a641c3471f2dee84a6ed17
  binary: llama-server
  # --offline: never fetch anything (-hf etc.); --no-webui / --no-slots: no web UI and no
  # /slots endpoint (it would expose the current request); one slot is enough.
  launch_defaults: ["--host", "127.0.0.1", "--offline", "--no-webui", "--no-slots", "-np", "1"]
  # The captioner is small: Vulkan works on every GPU vendor and avoids a second ~650 MB
  # CUDA runtime download on NVIDIA machines. Remove this line to use the CUDA build.
  backend_override: { cuda: vulkan }
  builds:
    windows_cuda:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-win-cuda-12.4-x64.zip
      sha256: 85b6d6fd41a1fc89a6af3d674665331d2f4578e2282ed5067e4c302327c9af0a
      size_bytes: 264520190
      size_mb: 265
      extra:
        - url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/cudart-llama-bin-win-cuda-12.4-x64.zip
          sha256: 8c79a9b226de4b3cacfd1f83d24f962d0773be79f1e7b75c6af4ded7e32ae1d6
          size_bytes: 391443627
          size_mb: 391
    windows_vulkan:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-win-vulkan-x64.zip
      sha256: 1badb42990715587a6a269cd6d5616e262110c7fa00d59f3d6e6d5b0dd25af08
      size_bytes: 33061382
      size_mb: 33
    windows_cpu:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-win-cpu-x64.zip
      sha256: 223911b76efe83aae03adbc1890e4d1b5004d13697a98a7258b7ffdfeb7b9bad
      size_bytes: 19157926
      size_mb: 19
    # Linux llama.cpp builds are .tar.gz with a top-level `llama-<tag>/` folder (glibc 2.34+);
    # the installer flattens that folder so runtime libraries sit next to llama-server.
    linux_cuda:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-ubuntu-cuda-12.8-x64.tar.gz
      sha256: e5d3bbb3db80df25d0a3d8fa072115b6cb1eae23ad12b8707d1a058ca05b504e
      size_bytes: 172239918
      size_mb: 172
      extra:
        - url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/cudart-llama-b11235-bin-ubuntu-cuda-12.8-x64.tar.gz
          sha256: 2d72d9bd5c36a07cc60e0b57eac2c2c067ced3de4b057aea5769314abfa6f02c
          size_bytes: 594377730
          size_mb: 594
    linux_vulkan:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-ubuntu-vulkan-x64.tar.gz
      sha256: 98c4181d3441d59e1e43052e9781a6a34bd24bb1c39df074b1fcada725b39d74
      size_bytes: 31350328
      size_mb: 31
    linux_cpu:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-ubuntu-x64.tar.gz
      sha256: 7f4f1dd11b5bc471db1de74df66a5e4065523c260ecc73780755a7c99cb68114
      size_bytes: 17404002
      size_mb: 17

# GPU vendor → preferred backend (hardware detection; Settings "engine backend" overrides).
selection:
  nvidia: cuda
  amd: vulkan
  intel: vulkan
  none: cpu

# If <os>_<backend> has no build, try these backends in order.
fallbacks:
  cuda: [vulkan, cpu]
  vulkan: [cpu]
  cpu: []
