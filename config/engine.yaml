# Pinned inference engines (SPEC §2 "Engine binaries"). Nothing here is bundled:
# the matching build is downloaded once (first run) into
#   Data/engine/sd/<version>/<backend>/      (sd-server)
#   Data/engine/llama/<version>/<backend>/   (llama-server, Describe tab only)
# and every archive is SHA-256 verified before it is unpacked or launched.
#
# Machine-readable schema (read by pinhole-engine `pins.rs` and CI `verify-pins`):
#   <engine>.version            release tag the URLs below belong to
#   <engine>.builds.<key>       key = <os>_<backend>, os ∈ windows|linux, backend ∈ cuda|vulkan|cpu
#     .url / .sha256 / .size_bytes / .size_mb   the main archive (.zip or .tar.gz)
#     .extra[]                  more archives unpacked into the SAME folder (e.g. CUDA runtime DLLs)
#   sha256: TODO                allowed while developing; the hash is then computed and recorded,
#                               not enforced. Release builds must have real hashes (CI checks).
#
# Update procedure: bump `version`, rewrite asset names, run the CI "verify pins" job (downloads
# every URL, checks size + SHA-256), then run the engine smoke test (PINHOLE_SMOKE=1).
#
# Verified: every size + SHA-256 below matches the digests GitHub publishes for the assets
# and the release SHA256SUMS.txt (sd-server 2026-10-01; llama-server 2026-09-28, downloaded
# and hashed).

schema_version: 1

stable_diffusion_cpp:
  # Pinhole's fork: upstream stable-diffusion.cpp at `commit`, unchanged except the sd-server
  # lock-down patch (engine/sd-cpp/: per-launch key in SD_API_KEY, --reject-origin), built by
  # the fork's "Pinhole engine build" workflow. Tag = upstream tag + -pinhole<n>; a new tag also
  # keeps an older unpatched install from being reused. Its server exposes the native async
  # /sdcpp/v1 API (img_gen, jobs, cancel, capabilities, upscale) used by Pinhole.
  repo: https://github.com/DavidGudovic/stable-diffusion.cpp
  version: master-929-3f8527a-pinhole1
  commit: 3f8527a46c54ecf4cb4ed6003da8e8982283c73c
  binary: sd-server
  # Added by the engine manager in addition to the per-model wiring args. The port is
  # chosen at launch (random free port on 127.0.0.1). Never listen on 0.0.0.0.
  # --disable-image-metadata: server-wide default off, on top of Pinhole always sending
  # "embed_image_metadata": false per request (defense in depth).
  # --log-level info: the auto-fit memory plan ("auto-fit plan: …", backend_fit.cpp) is INFO;
  # it only reaches the in-memory ring buffer (Details). Prompt text is printed at verbose
  # only, which Pinhole never allows (generate.rs full_sd_args clamps the level).
  # --mmap: weights auto-fit parks in system memory are mapped from the model file
  # (model_manager.cpp can_mmap_storage) instead of copied into pinned host buffers
  # (model_manager.cpp params_buffer_type_for), so the OS can page them out.
  launch_defaults: ["--listen-ip", "127.0.0.1", "--log-level", "info", "--disable-image-metadata", "--mmap"]
  builds:
    windows_cuda:
      # CUDA 12.8.1, CMAKE_CUDA_ARCHITECTURES 61;70;75;80;86;89;90;100;120 → includes RTX 50xx
      # (Blackwell, sm_120). Needs an NVIDIA driver with CUDA 12.8 support (570+).
      url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/sd-master-929-3f8527a-pinhole1-bin-win-cuda12-x64.zip
      sha256: 9ed63ba54582d18bac77238934c1ca16a2587d5537e30bed286eab4f9642bd5b
      size_bytes: 337844954
      size_mb: 338
      extra:
        # cudart64_12.dll, cublas64_12.dll, cublasLt64_12.dll — must sit next to sd-server.exe.
        - url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/cudart-sd-bin-win-cu12-x64.zip
          sha256: fe20366827d357c00797eebb58244dddab7fd9a348d70090c3871004c320f38d
          size_bytes: 563452046
          size_mb: 563
    windows_vulkan:
      url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/sd-master-929-3f8527a-pinhole1-bin-win-vulkan-x64.zip
      sha256: 7614331da9303798e523d92648f65ffa4555a4276b86015c339d12924c149752
      size_bytes: 30029173
      size_mb: 30
    windows_cpu:
      url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/sd-master-929-3f8527a-pinhole1-bin-win-cpu-x64.zip
      sha256: 2df17b82758a49c5b02503b84ccec3983bde504764bea140c4d8db963b84c41f
      size_bytes: 17448207
      size_mb: 17
    # Linux builds are made on Ubuntu 24.04 and need glibc >= 2.38 (Ubuntu 24.04+).
    linux_cuda:
      # CUDA 12.8.1 for RTX 30/40/50 only (sm_86, sm_89, sm_120) to keep the download small;
      # hardware detection picks it only for compute capability 8.6+ (older cards use Vulkan).
      # Needs the NVIDIA proprietary driver (570+).
      url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/sd-master-929-3f8527a-pinhole1-bin-Linux-Ubuntu-24.04-x86_64-cuda12.zip
      sha256: 4d9ac869180f55ecb481257ed931b9e99c517d5f3eb7bd36eda0443e8d2a800a
      size_bytes: 140562103
      size_mb: 141
      min_glibc: "2.38"
      extra:
        # libcudart.so.12, libcublas.so.12, libcublasLt.so.12 next to sd-server (RUNPATH $ORIGIN).
        - url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/cudart-sd-bin-Linux-Ubuntu-24.04-x86_64-cu12.zip
          sha256: 7af0da5584760d9cdf73e6c4a572702e7c597b7796a00a986627300787fb76c0
          size_bytes: 594376445
          size_mb: 594
    linux_vulkan:
      url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/sd-master-929-3f8527a-pinhole1-bin-Linux-Ubuntu-24.04-x86_64-vulkan.zip
      sha256: 9556e250e24c48833ffe6afc8f407df6183193e05db87e885921a6cb97f3dc6b
      size_bytes: 36845461
      size_mb: 37
      min_glibc: "2.38"
    linux_cpu:
      url: https://github.com/DavidGudovic/stable-diffusion.cpp/releases/download/master-929-3f8527a-pinhole1/sd-master-929-3f8527a-pinhole1-bin-Linux-Ubuntu-24.04-x86_64-cpu.zip
      sha256: 9749fe206e059ce3fdcf31bb8298b6d3de8473794fbdc0899f3d693dbc76d504
      size_bytes: 25984369
      size_mb: 26
      min_glibc: "2.38"

llama_cpp:
  repo: https://github.com/ggml-org/llama.cpp
  version: b11235
  commit: 6c7a87f7e5e5cd75b8a641c3471f2dee84a6ed17
  binary: llama-server
  # --offline: never fetch anything (-hf etc.); --no-webui / --no-slots: no web UI and no
  # /slots endpoint (it would expose the current request); one slot is enough.
  launch_defaults: ["--host", "127.0.0.1", "--offline", "--no-webui", "--no-slots", "-np", "1"]
  # The captioner is small: Vulkan works on every GPU vendor and avoids a second ~650 MB
  # CUDA runtime download on NVIDIA machines. Remove this line to use the CUDA build.
  backend_override: { cuda: vulkan }
  builds:
    windows_cuda:
      url: https://github.com/ggml-org/llama.cpp/releases/download/b11235/llama-b11235-bin-win-cuda-12.4-x64.zip
      sha256: 85b6d6fd41a1fc89a6af3d674665331d2f4578e2282ed5067e4c302327c9af0a
      size_bytes: 264520190
      size_mb: 265
