# Recommended models per role (SPEC §6.1). Ranked best-first.
# Pinhole picks the first candidate whose VRAM min fits this GPU, then the best quant that fits.
# Without a usable GPU a candidate "fits" when it can run on the processor (vram.rs fit_cpu).
# Nothing here is bundled — every entry is a one-click download.
# CivitAI size_mb: CivitAI `sizeKB` is KiB → size_mb = sizeKB × 1024 / 1e6.
recommended:
  realistic:
    - { family: z_image_turbo, source: registry }
    - { family: sdxl, source: civitai, civitai_model_id: 133005, civitai_version_id: 1759168, title: "Juggernaut XL (Ragnarok)", size_mb: 7105, vram_gb: { min: 6, recommended: 10 }, note: "top-rated realistic SDXL finetune, for GPUs < 8 GB" }
    # Last resort: no usable GPU (fits against RAM, vram.rs fit_cpu) or under 5 GB of VRAM.
    - { family: sd15, source: registry, title: "Stable Diffusion 1.5 (small, runs on any computer)", note: "older and less detailed, but runs without a graphics card" }
  # A second Realistic card (recommend.rs OPTIONAL_ROLES): shown only when it
  # fits (12 GB+: Q5_K_S below 20 GB, Q8_0 from 20 GB); Z-Image Turbo stays first.
  realistic_detail:
    - { family: krea2_turbo, source: registry, title: "Krea 2 Turbo — more detail, slower" }
  anime:
    - { family: sdxl_illustrious, source: civitai, civitai_model_id: 376130, civitai_version_id: 2940478, title: "Nova Anime XL (IL v19.0)", size_mb: 6939, vram_gb: { min: 6, recommended: 10 }, note: "top-rated Illustrious checkpoint" }
    - { family: sdxl_pony, source: civitai, civitai_model_id: 257749, civitai_version_id: 290640, title: "Pony Diffusion V6 XL", size_mb: 6938, vram_gb: { min: 6, recommended: 10 } }
  edit:
    - { family: qwen_image_edit_2511, source: registry }
    - { family: flux1_kontext, source: registry }
  # A second Edit card (recommend.rs OPTIONAL_ROLES): a lighter edit model next
  # to Qwen Image Edit, left out when it is already the Edit pick (small cards).
  edit_alt:
    - { family: flux1_kontext, source: registry, title: "FLUX.1 Kontext — lighter, faster edits" }
  describe:
    - { captioner: reuse }       # free if Qwen Image Edit is installed
    - { captioner: default }

# img2text (Describe tab), served by llama-server
captioner:
  prefer_reuse: [qwen25_vl_7b_q8, qwen25_vl_7b_mmproj]   # reuse the edit model's encoder if installed
  default:
    model: { file: Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf, url: "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/main/Qwen2.5-VL-3B-Instruct-Q4_K_M.gguf", sha256: d02fe9b69ad8cadbbd228e387667af66612c44bed29ffc8eb1e7caf9ac486c12, size_mb: 1930 }
    mmproj: { file: mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf, url: "https://huggingface.co/ggml-org/Qwen2.5-VL-3B-Instruct-GGUF/resolve/main/mmproj-Qwen2.5-VL-3B-Instruct-Q8_0.gguf", sha256: 980c9b2f78c04e6cff93d277ada09e768394f112d75db3b4e9dea8a69f9fb904, size_mb: 845 }
  idle_shutdown_seconds: 60
  prompts:
    sentence: >
      Describe this image as a single detailed prompt for an image generator.
      Cover subject, clothing, pose, setting, lighting, camera angle and style.
      Output only the prompt, no preamble.
    tags: >
      List booru-style tags for this image, most important first, comma-separated,
      lowercase, underscores instead of spaces. Output only the tags.

# VRAM tiers → engine flags and quant choice. Chosen automatically; overridable in Settings.
#
# No --offload-to-cpu: sd-server's auto-fit is ON by default (common.cpp
# `--auto-fit`, docs/backend.md "Automatic placement") and already places each
# module's weights on the GPU, else in RAM, else on disk, keeping as much
# resident on the GPU as fits. `--offload-to-cpu` prepends `*=cpu` to
# --params-backend (common.cpp prepare_backend_assignments), which DISABLES
# auto-fit (diffusion_engine.cpp: auto_fit_enabled = auto_fit && params_backend
# empty) and forces every weight into RAM — worse on low-RAM PCs.
# `--max-vram`: Pinhole passes `-2` on 12 GB+ cards (keep 2 GiB free; auto-fit's own
# default, free VRAM − 512 MiB, ran out on Windows/CUDA when a model only just fit), `-1` on
# 8–12 GB, and a bigger reserve as an out-of-memory retry (generate.rs vram_reserves). A
# --max-vram here wins over both.
# Pinhole adds --offload-to-cpu only as a later out-of-memory retry, when every weight fits in RAM
# (generate.rs next_memory_fallback).
# VAE tiling stays for small cards: decode retries with tiles on OOM by itself,
# but img2img/edit *encoding* does not (docs/performance.md).
hardware_profiles:
  - name: low        # < 8 GB
    max_vram_gb: 7.9
    flags: ["--vae-tiling"]
    prefer_quant: q4_k
  - name: mid        # 8–12 GB
    max_vram_gb: 12.9
    flags: ["--vae-tiling"]
    prefer_quant: q8_0
  - name: high       # 13–20 GB (e.g. RTX 5070 Ti 16 GB)
    max_vram_gb: 20.9
    flags: []
    # Q8 first: bf16 Z-Image (12.3 GB) + its text encoder did not fit a 16 GB
    # card (real-GPU report). bf16 stays the pick at 21 GB+ (ultra).
    prefer_quant: q8_0
  - name: ultra      # 21 GB+
    max_vram_gb: 999
    flags: []
    prefer_quant: bf16

