# Pinhole model registry
# ---------------------------------------------------------------------------
# Everything Pinhole knows about model families lives here. The app loads this
# file, then deep-merges Data/config/overrides.yaml on top (maps merge, user
# wins, scalars and lists replace). No code change is needed for a new
# finetune of a known family.
#
# Engine: stable-diffusion.cpp master-929-3f8527a (config/engine.yaml). Detect
# rules, flags, sampler/scheduler names and defaults below were checked against
# that source (file references in the comments).
#
# STATUS
# * sha256 / size of every Hugging Face file: verified 2026-09-28 by the CI
#   probe (LFS oid + size). `size_mb` = round(bytes / 1_000_000), decimal MB.
#   Every repo used below was checked `gated: false` the same day.
# * Families added 2026-09-28 (FLUX.2, Krea 2, Anima, Chroma, Qwen-Image 2.1,
#   SD 3.5, HiDream-O1, ERNIE-Image, Mage-Flow; "Flux.1 Krea" → FLUX.1 dev):
#   detect rules, flags and defaults follow the pinned engine source +
#   docs/*.md and the official ComfyUI workflow templates
#   (Comfy-Org/workflow_templates). NONE of them has been run on real hardware
#   yet — treat their defaults as untested. Every URL / size / SHA-256 above
#   and below was re-checked against the HF tree API on 2026-09-28 (API probe
#   run 13): all match, all repos ungated.
# * Not registered: MiniMax H3 (CivitAI "MiniMax H3") — video + audio only in
#   the pinned engine (model.h sd_version_supports_video_generation; img_gen
#   refuses it) and it needs a 32B Qwen3-VL text encoder. HiDream-I1
#   ("HiDream"), Lumina 2 and AuraFlow are not in the pinned engine. The
#   engine also runs PixArt, Lens, Boogu, Ming-Image, LongCat and Ovis-Image:
#   no family yet (few CivitAI files).
# * `sha256: TODO` = not verified yet (none left; the release workflow fails on any).
# * CivitAI baseModel strings: checked against the live /api/v1/enums.
# * `vram_gb` values are ESTIMATES until measured on 8/12/16 GB cards (SPEC §14).
#
# Family keys
#   inherits: <family>   deep-merge that family first (multi-level). A parent's
#                        `download` and `civitai_base_models` are not inherited.
#   detect:              header-sniffing rules (SPEC §6 step 3), mirroring
#                        get_sd_version() in src/model_loader.cpp:
#     any_tensor / all_tensor / none_tensor / all_of_any (AND of OR-lists)
#     tensor_ne0: { pattern: n }  tensors matching `pattern` must have ne[0] == n
#                                 (ggml order = last PyTorch dim)
#     decisive_tensor:  a match makes this family win over look-alikes
#     same_as: <family> copy that family's rules (still a separate family)
#     ambiguous_with:   look-alike families (hash / CivitAI / ask the user)
#   Patterns are substrings of the tensor name, tried with and without the
#   `model.diffusion_model.` prefix the loader adds to standalone diffusion
#   files; `^` anchors at the start, `$` at the end.
#   flags:               extra sd-server arguments for this family.
#   dials.size_multiple: width/height multiple (UNet 64 = vae 8 × unet 8;
#                        DiT 16 = vae 8 × 2×2 patches). See
#                        get_diffusion_model_down_factor(), diffusion_engine.cpp.
# ---------------------------------------------------------------------------

