# What the pinned sd-server can do that changes wiring.
engine_features:
  # sd-server builds its context with tae_preview_only = false
  # (examples/server/main.cpp: ctx_params.to_sd_ctx_params_t(false)), so
  # `--taesd` would REPLACE the VAE for the final image, and the server API has
  # no preview stream. Keep false until the server gains preview-only TAESD;
  # the `taesd:` entries below stay so turning this on needs no other change.
  taesd_preview: false

# How prompt + style are joined at request time (SPEC §7). Never stored.
style_templates:
  natural: "{prompt}. Style: {style}"
  tags: "{prompt}, {style}"

# Shared dial definitions. Families reference or override these.
dial_presets:
  shapes_1024: &shapes_1024
    square:    [1024, 1024]
    portrait:  [832, 1216]
    landscape: [1216, 832]
    wide:      [1344, 768]
  shapes_512: &shapes_512
    square:    [512, 512]
    portrait:  [512, 768]
    landscape: [768, 512]
    wide:      [896, 512]     # multiple of 64 (UNet); 912 would be re-aligned by the engine

families:

  # ---------------------------------------------------------------- SD 1.5
  sd15:
    label: "Stable Diffusion 1.5"
    style_template: tags
    vram_gb: { min: 4, recommended: 6 }        # ESTIMATE — measure before release
    activation_gb: 1.0
    # Small enough to run on the processor when there is no usable GPU
    # (vram.rs fit_cpu: Tight = "runs on the processor — slow").
    cpu_friendly: true
    modes: [txt2img, img2img, inpaint]
    detect:
      # get_sd_version(): UNet blocks + a CLIP-L token embedding (ne0 768 → SD1;
      # SD2's OpenCLIP is 1024 and named differently), and no second text encoder
      # (that makes it SDXL). SVD shares the UNet names. Without the second
      # middle-block ResNet (middle_block.1 / mid_block.resnets.1) upstream says
      # SDXS-512 / SD1 tiny UNet (VERSION_SDXS_512_DS / VERSION_SD1_TINY_UNET),
      # which are not SD 1.5.
      all_of_any:
        - ["input_blocks.", "unet.down_blocks."]
        - ["text_model.embeddings.token_embedding.weight$"]
        - ["middle_block.1.", "unet.mid_block.resnets.1."]
      none_tensor: ["conditioner.embedders.1", "cond_stage_model.1", "^te.1.", "input_blocks.8.0.time_mixer.mix_factor"]
      tensor_ne0: { "text_model.embeddings.token_embedding.weight$": 768 }
    civitai_base_models: ["SD 1.5", "SD 1.4"]     # 1.4 = same architecture, older weights
    layout: all_in_one
    components: {}
    taesd: null
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]      # memory-efficient attention (docs/performance.md); falls back per op where unsupported
    defaults:
      sampler: dpm++2m
      scheduler: karras
      clip_skip: 1
      negative_prompt: "lowres, blurry, bad anatomy, extra fingers, watermark, text"
    dials:
      shape: *shapes_512
      size_multiple: 64
      quality: { fast: 15, balanced: 25, best: 35 }
      cfg_range: [4.0, 11.0]
      cfg_default: 7.0
      hires_at_best: { enabled: true, scale: 1.5, denoising_strength: 0.45 }
    # The original SD 1.5 (fp16 prune). Old and modest, but small: the one-click
    # pick for PCs without a usable GPU and cards under 5 GB (recommended.realistic).
    download:
      file: v1-5-pruned-emaonly-fp16.safetensors
      url: https://huggingface.co/Comfy-Org/stable-diffusion-v1-5-archive/resolve/main/v1-5-pruned-emaonly-fp16.safetensors
      sha256: e9476a13728cd75d8279f6ec8bad753a66a1957ca375a1464dc63b37db6e3916
      size_mb: 2133                              # 2 132 696 762 bytes

  # Few-step SD 1.5 finetunes (Hyper-SD merges): same files, very different defaults.
  sd15_fast:
    inherits: sd15
    label: "SD 1.5 · Hyper"
    civitai_base_models: ["SD 1.5 Hyper"]
    detect: { same_as: sd15 }
    defaults:
      sampler: euler_a
      scheduler: sgm_uniform
    dials:
      quality: { fast: 4, balanced: 6, best: 8 }
      cfg_range: [1.0, 2.5]
      cfg_default: 1.5
      hires_at_best: { enabled: false }

  # ---------------------------------------------------------------- SDXL (base + generic finetunes)
  sdxl:
    label: "SDXL"
    style_template: tags
    vram_gb: { min: 6, recommended: 10 }       # ESTIMATE (min uses VAE tiling)
    activation_gb: 2.0
    modes: [txt2img, img2img, inpaint]
    detect:
      # get_sd_version(): is_unet && has_multiple_encoders → SDXL (incl. the
      # distilled SSD-1B / Vega and inpaint variants, which run the same way).
      all_of_any:
        - ["input_blocks.", "unet.down_blocks."]
        - ["conditioner.embedders.1", "cond_stage_model.1", "^te.1."]
      none_tensor: ["input_blocks.8.0.time_mixer.mix_factor"]   # SVD
    civitai_base_models: ["SDXL 1.0", "SDXL 0.9", "SDXL Distilled"]
    layout: all_in_one
    components:
      vae_override: sdxl_vae_fp16_fix   # avoids black/NaN images in fp16 (docs/sd.md passes --vae too)
    taesd: taesdxl
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]      # see sd15
    defaults:
      sampler: dpm++2m
      scheduler: karras
      clip_skip: 1
      negative_prompt: "lowres, blurry, bad anatomy, deformed hands, watermark, text"
    dials:
      shape: *shapes_1024
      size_multiple: 64
      quality: { fast: 20, balanced: 30, best: 40 }
      cfg_range: [3.0, 9.0]
      cfg_default: 6.0
      hires_at_best: { enabled: false }

  # Pony / Illustrious / NoobAI are SDXL architecture but want different defaults.
  # Detected via CivitAI baseModel or known hash; header sniffing alone says "sdxl".
  sdxl_pony:
    inherits: sdxl
    label: "SDXL · Pony"
    civitai_base_models: ["Pony"]              # NOT "Pony V7" (different architecture)
    detect: { same_as: sdxl }
    defaults:
      sampler: euler_a
      scheduler: discrete
      clip_skip: 2
      auto_prompt_prefix: "score_9, score_8_up, score_7_up, "   # added at request time, user can disable
      negative_prompt: "score_4, score_5, score_6, lowres, bad anatomy"
    dials:
      cfg_range: [4.0, 8.0]
      cfg_default: 6.0

  sdxl_illustrious:
    inherits: sdxl
    label: "SDXL · Illustrious / NoobAI"
    civitai_base_models: ["Illustrious", "NoobAI"]
    detect: { same_as: sdxl }
    defaults:
      sampler: euler_a
      scheduler: discrete
      clip_skip: 2
      auto_prompt_prefix: "masterpiece, best quality, "
      negative_prompt: "worst quality, low quality, lowres, bad anatomy, bad hands, watermark"
    dials:
      cfg_range: [4.0, 8.0]
      cfg_default: 5.5

  # Few-step SDXL finetunes (Lightning / Hyper / Turbo merges). With the plain
  # SDXL defaults (30 steps, CFG 6) these burn out, so they get their own entry.
  # ("SDXL 1.0 LCM" is left out: it needs the lcm sampler + LCM LoRA workflow.)
  sdxl_fast:
    inherits: sdxl
    label: "SDXL · Lightning / Hyper / Turbo"
    civitai_base_models: ["SDXL Lightning", "SDXL Hyper", "SDXL Turbo"]
    detect: { same_as: sdxl }
    defaults:
      sampler: euler
      scheduler: sgm_uniform
    dials:
      quality: { fast: 4, balanced: 6, best: 8 }
      cfg_range: [1.0, 2.5]
      cfg_default: 1.5

  # ---------------------------------------------------------------- FLUX.1
  flux1_dev:
    label: "FLUX.1 dev"
    style_template: natural
    activation_gb: 2.5                          # no download spec: VRAM estimated from file size (SPEC §6.2)
    license_note: "Non-commercial license"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `double_blocks.` / `single_transformer_blocks.` → Flux,
      # unless it is FLUX.2, Chroma(-Radiance), Ovis, Fill/Controls/Flex.2 (img_in
      # width 384/128/196) or LongCat (txt_in width 3584). dev and Kontext are
      # guidance-distilled (`guidance_in`, flux.hpp guidance_embed); schnell is not.
      any_tensor: ["double_blocks.", "single_transformer_blocks."]
      all_of_any:
        - ["guidance_in.in_layer.weight", "time_text_embed.guidance_embedder."]
      none_tensor:
        - "double_stream_modulation_img.lin.weight"   # FLUX.2
        - "distilled_guidance_layer."                 # Chroma (model_builders.cpp)
        - "nerf_final_layer_conv."                    # Chroma Radiance
        - "double_blocks.0.img_mlp.gate_proj.weight"  # Ovis-Image
      tensor_ne0:
        "^img_in.weight$": 64
        "^txt_in.weight$": 4096
      ambiguous_with: [flux1_kontext]   # same tensors → hash / CivitAI / ask
    # "Flux.1 Krea" = FLUX.1 Krea [dev]: same architecture and tensors as dev;
    # the official ComfyUI template runs it like dev (20 steps, default guidance).
    civitai_base_models: ["Flux.1 D", "Flux.1 Krea"]
    layout: diffusion_only
    components: { vae: flux_ae, clip_l: clip_l, t5xxl: { vram_gte_16: t5xxl_fp16, else: t5xxl_fp8 } }
    taesd: taef1
    uses_negative_prompt: false
    # No --clip-on-cpu: it is deprecated (common.cpp "use --backend te=cpu") and
    # auto-fit (on by default) already parks T5 in RAM when VRAM is short while
    # still encoding on the GPU, which is much faster than CPU encoding.
    flags: ["--diffusion-fa"]      # see sd15
    # `flux` = the engine's own default for Flux (resolution-aware shift,
    # default_scheduler() in src/pipeline/request.cpp).
    defaults: { sampler: euler, scheduler: flux, guidance: 3.5 }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 16, balanced: 24, best: 32 }
      cfg_fixed: 1.0                            # docs/flux.md: --cfg-scale 1.0
      stick_to_prompt_maps_to: guidance
      guidance_range: [2.0, 5.0]

  flux1_schnell:
    inherits: flux1_dev
    label: "FLUX.1 schnell"
    license_note: "Apache 2.0"
    civitai_base_models: ["Flux.1 S"]
    detect:
      # Same as dev but WITHOUT the guidance embedder.
      all_of_any: []
      none_tensor:
        - "double_stream_modulation_img.lin.weight"
        - "distilled_guidance_layer."
        - "nerf_final_layer_conv."
        - "double_blocks.0.img_mlp.gate_proj.weight"
        - "guidance_in."
        - "time_text_embed.guidance_embedder."
      ambiguous_with: []
    defaults: { guidance: null }                # not guidance-distilled
    dials:
      quality: { fast: 2, balanced: 4, best: 6 } # docs/flux.md: --steps 4
      stick_to_prompt_maps_to: null
      guidance_range: null

  # ---------------------------------------------------------------- Z-Image
  z_image_turbo:
    label: "Z-Image Turbo"
    style_template: natural
    activation_gb: 2.0
    license_note: "Apache 2.0"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `cap_embedder.0.weight` → Z-Image, unless the file also
      # carries Ming-Image's LLM connector. The engine stops there, but Lumina-2
      # finetunes (CivitAI "Lumina", e.g. Neta Lumina) share the name with a
      # 2304-wide (Gemma-2) caption norm; Z-Image's is Qwen3-4B's 2560.
      any_tensor: ["cap_embedder.0.weight"]
      none_tensor: ["text_encoders.llm.connector.layers.0.self_attn.q_proj.weight"]
      tensor_ne0: { "^cap_embedder.0.weight$": 2560 }
      ambiguous_with: [z_image_base]
    civitai_base_models: ["ZImageTurbo"]
    layout: diffusion_only
    components:
      vae: flux_ae
      # docs/z_image.md. bf16 text encoder only at 20 GB+: on a 16 GB card bf16
      # Z-Image + the 8 GB bf16 encoder ran out of VRAM while encoding the prompt.
      llm: { vram_gte_20: qwen3_4b, vram_gte_10: qwen3_4b_q8, else: qwen3_4b_q4km }
    taesd: taef1
    uses_negative_prompt: false
    flags: ["--diffusion-fa"]                     # docs/z_image.md
    defaults: { sampler: euler, scheduler: simple }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 6, balanced: 8, best: 10 } # docs/z_image.md: --steps 8
      cfg_fixed: 1.0                              # docs/z_image.md: --cfg-scale 1.0
    download:
      file: z_image_turbo_bf16.safetensors
      url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_bf16.safetensors
      sha256: 2407613050b809ffdff18a4ac99af83ea6b95443ecebdf80e064a79c825574a6
      size_mb: 12310
      vram_gb: { min: 12, recommended: 16 }    # ESTIMATE, text encoder offloaded to RAM by auto-fit
      alt_quants:        # best quant that fits is picked automatically (bf16 → q8 → q4)
        q8_0: { file: z_image_turbo-Q8_0.gguf, url: "https://huggingface.co/leejet/Z-Image-Turbo-GGUF/resolve/main/z_image_turbo-Q8_0.gguf", sha256: df1c5baa86d1398c979495a6072dbcee79444fdb884a2445582ba0769c44e9a1, size_mb: 6577, vram_gb: { min: 8, recommended: 12 } }
        q4_k: { file: z_image_turbo-Q4_K.gguf, url: "https://huggingface.co/leejet/Z-Image-Turbo-GGUF/resolve/main/z_image_turbo-Q4_K.gguf", sha256: 14b375ab4f226bc5378f68f37e899ef3c2242b8541e61e2bc1aff40976086fbd, size_mb: 3864, vram_gb: { min: 5, recommended: 8 } }

  z_image_base:
    inherits: z_image_turbo
    label: "Z-Image"
    civitai_base_models: ["ZImageBase"]
    detect:
      ambiguous_with: [z_image_turbo]
    uses_negative_prompt: true
    dials:
      quality: { fast: 20, balanced: 30, best: 40 }
      cfg_fixed: null
      cfg_range: [3.0, 7.0]
      cfg_default: 5.0                            # docs/z_image.md: --cfg-scale 5.0

  # ---------------------------------------------------------------- Qwen-Image
  # Qwen-Image (txt2img) and Qwen-Image-Edit share every tensor name
  # (VERSION_QWEN_IMAGE for both); CivitAI files both under "Qwen".
  qwen_image:
    label: "Qwen-Image"
    style_template: natural
    activation_gb: 3.0
    license_note: "Apache 2.0"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `transformer_blocks.0.img_mod.1.weight` → Qwen-Image,
      # except Mage-Flow (img_in width 128), Qwen-Image-Layered (addition_t_embedding),
      # Lens (img_mlp.w1) and Qwen-Image 2.1 (txt_in.text_norm).
      any_tensor: ["transformer_blocks.0.img_mod.1.weight"]
      none_tensor:
        - "time_text_embed.addition_t_embedding.weight"
        - "transformer_blocks.0.img_mlp.w1.weight"
        - "^txt_in.text_norm.weight$"
      tensor_ne0: { "^img_in.weight$": 64 }
      ambiguous_with: [qwen_image_edit_2511]
    civitai_base_models: ["Qwen"]
    layout: diffusion_only
    components: { vae: qwen_image_vae, llm: qwen25_vl_7b_q8 }   # docs/qwen_image.md
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]                     # docs/qwen_image.md
    defaults: { sampler: euler, flow_shift: 3.0 } # docs/qwen_image.md: --flow-shift 3
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 12, balanced: 20, best: 30 }
      cfg_range: [1.5, 4.0]
      cfg_default: 2.5                            # docs/qwen_image.md: --cfg-scale 2.5

  # ---------------------------------------------------------------- Qwen-Image 2.1
  qwen_image_21:
    label: "Qwen-Image 2.1"
    style_template: natural
    activation_gb: 3.0
    license_note: "Qwen Research License"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): exact `model.diffusion_model.txt_in.text_norm.weight`
      # → VERSION_QWEN_IMAGE_2_1 (qwen_image / mage_flow exclude it).
      any_tensor: ["^txt_in.text_norm.weight$"]
    civitai_base_models: ["Qwen 2.1"]   # "Qwen 2" / "Qwen 3" are API-only models on CivitAI
    layout: diffusion_only
    components:
      vae: qwen_image_21_vae            # docs: older Qwen-Image / Wan VAEs are not interchangeable
      llm: { vram_gte_20: qwen3vl_8b_q8, else: qwen3vl_8b_q4km }
    uses_negative_prompt: true
    # docs/qwen_image_2.1.md uses --fa (its prefix cache stores FP16 only with flash attention).
    flags: ["--fa"]
    defaults: { sampler: euler }        # scheduler: engine default (flux, resolution-dependent)
    dials:
      shape: *shapes_1024
      size_multiple: 32                 # VAE 16 × down factor 2; docs: "divisible by 32"
      quality: { fast: 16, balanced: 25, best: 35 }   # ComfyUI template: 25 steps
      cfg_range: [3.0, 8.0]
      cfg_default: 6.0                  # docs/qwen_image_2.1.md: --cfg-scale 6.0

  # ---------------------------------------------------------------- FLUX.2
  # get_sd_version(): `double_stream_modulation_img` → FLUX.2; with
  # `single_blocks.47` it is FLUX.2 dev (VERSION_FLUX2), else klein. klein 4B vs
  # 9B: txt_in takes 3 stacked Qwen3 hidden states (conditioner.hpp out_layers
  # {9, 18, 27}) → 3 × 2560 = 7680 (Qwen3-4B) vs 3 × 4096 = 12288 (Qwen3-8B).
  # SeFi-Image reuses the FLUX.2 blocks (dual_time_embed) and is excluded.
  # Distilled and base klein share every tensor → CivitAI / hash / ask.
  # Steps/CFG: docs/flux2.md and the ComfyUI templates (distilled 4 steps CFG 1,
  # base 20 steps CFG 4–5). Scheduler: engine default for FLUX.2 (flux2).
  flux2_klein_4b:
    label: "FLUX.2 klein 4B"
    style_template: natural
    activation_gb: 2.0
    license_note: "Apache 2.0"
    modes: [txt2img, img2img]
    detect:
      any_tensor: ["double_stream_modulation_img.lin.weight"]
      none_tensor: ["single_blocks.47.linear1.weight", "dual_time_embed.semantic_embedder."]
      tensor_ne0: { "^txt_in.weight$": 7680 }
    civitai_base_models: ["Flux.2 Klein 4B"]
    layout: diffusion_only
    components:
      vae: flux2_vae
      llm: { vram_gte_20: qwen3_4b, vram_gte_10: qwen3_4b_q8, else: qwen3_4b_q4km }   # same encoder as Z-Image
    uses_negative_prompt: false
    flags: ["--diffusion-fa"]           # docs/flux2.md
    defaults: { sampler: euler }
    dials:
      shape: *shapes_1024
      size_multiple: 16                 # FLUX.2 VAE downsamples 16×, patch 1
      quality: { fast: 3, balanced: 4, best: 6 }
      cfg_fixed: 1.0

  flux2_klein_4b_base:
    inherits: flux2_klein_4b
    label: "FLUX.2 klein 4B Base"
    civitai_base_models: ["Flux.2 Klein 4B-base"]
    detect: { same_as: flux2_klein_4b }
    uses_negative_prompt: true
    dials:
      quality: { fast: 16, balanced: 20, best: 28 }
      cfg_fixed: null
      cfg_range: [2.5, 6.0]
      cfg_default: 4.0                  # docs/flux2.md: --cfg-scale 4.0 (ComfyUI template: 5)

  flux2_klein_9b:
    label: "FLUX.2 klein 9B"
    style_template: natural
    activation_gb: 2.5
    license_note: "Non-commercial license"
    modes: [txt2img, img2img]
    detect:
      any_tensor: ["double_stream_modulation_img.lin.weight"]
      none_tensor: ["single_blocks.47.linear1.weight", "dual_time_embed.semantic_embedder."]
      tensor_ne0: { "^txt_in.weight$": 12288 }
    civitai_base_models: ["Flux.2 Klein 9B"]
    layout: diffusion_only
    components:
      vae: flux2_vae
      llm: { vram_gte_20: qwen3_8b_q8, else: qwen3_8b_q4km }
    uses_negative_prompt: false
    flags: ["--diffusion-fa"]
    defaults: { sampler: euler }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 3, balanced: 4, best: 6 }
      cfg_fixed: 1.0

  flux2_klein_9b_base:
    inherits: flux2_klein_9b
    label: "FLUX.2 klein 9B Base"
    civitai_base_models: ["Flux.2 Klein 9B-base"]
    detect: { same_as: flux2_klein_9b }
    uses_negative_prompt: true
    dials:
      quality: { fast: 16, balanced: 20, best: 28 }
      cfg_fixed: null
      cfg_range: [2.5, 6.0]
      cfg_default: 4.0

  # FLUX.2 dev: 32B, guidance-distilled (ComfyUI template: FluxGuidance 4,
  # 20 steps). Heavy: ~20 GB Q4 diffusion + 14 GB text encoder, auto-fit streams
  # from RAM on anything under ~40 GB of VRAM.
  flux2_dev:
    label: "FLUX.2 dev"
    style_template: natural
    activation_gb: 4.0
    license_note: "Non-commercial license"
    modes: [txt2img, img2img]
    detect:
      any_tensor: ["double_stream_modulation_img.lin.weight"]
      all_tensor: ["single_blocks.47.linear1.weight"]
      none_tensor: ["dual_time_embed.semantic_embedder."]
    civitai_base_models: ["Flux.2 D"]
    layout: diffusion_only
    components: { vae: flux2_vae, llm: mistral_small_32_q4km }
    uses_negative_prompt: false
    flags: ["--diffusion-fa"]
    defaults: { sampler: euler, guidance: 4.0 }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 16, balanced: 20, best: 28 }
      cfg_fixed: 1.0                    # docs/flux2.md: --cfg-scale 1.0
      stick_to_prompt_maps_to: guidance
      guidance_range: [2.0, 6.0]

  # ---------------------------------------------------------------- Krea 2
  # krea-ai/krea-2 README: Turbo is 8-step distilled, CFG off, mu 1.15 (= the
  # engine's Krea 2 flow shift, diffusion_engine.cpp); Raw is the undistilled
  # base "for fine-tuning and LoRA training" ("TRAIN on Raw and RUN on Turbo"),
  # 52 steps CFG 3.5. CivitAI files everything under "Krea 2" → Turbo settings;
  # Raw is recognised by hash or picked by the user. Engine: int8 convrot
  # (CUDA ≥ 7.5 native, Vulkan only with packed INT8 dot products, else CPU
  # fallback — docs/int8_convrot.md), fp8 (scaled) and GGUF load; ComfyUI
  # nvfp4 / mxfp8 / int4 files do not (U8-packed weights are skipped by the
  # safetensors reader).
  krea2_turbo:
    label: "Krea 2 Turbo"
    style_template: natural
    activation_gb: 3.0
    license_note: "Krea 2 Community License: commercial use only under $1M yearly revenue"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): txtfusion / text_fusion projector → VERSION_KREA2.
      any_tensor: ["txtfusion.projector.weight", "text_fusion.projector.weight"]
    civitai_base_models: ["Krea 2"]
    layout: diffusion_only
    components:
      vae: qwen_image_vae               # what Comfy-Org/Krea-2 ships (Wan 2.1 layout, docs/krea2.md)
      llm: { vram_gte_10: qwen3vl_4b_q8, else: qwen3vl_4b_q4km }
    uses_negative_prompt: false
    flags: ["--diffusion-fa"]           # docs/krea2.md
    defaults: { sampler: euler }        # ComfyUI template: euler, 8 steps, CFG 1
    dials:
      shape: *shapes_1024
      size_multiple: 16                 # README: sizes are padded up to a multiple of 16
      quality: { fast: 6, balanced: 8, best: 12 }
      cfg_fixed: 1.0
    # One-click download (recommended.realistic_detail): GGUF quants from
    # realrebelai/KREA-2_GGUFs (docs/krea2.md; ungated). krea/Krea-2-* are gated,
    # so never used. Licence (LICENSE.pdf in krea-ai/krea-2, identical copy in
    # Comfy-Org/Krea-2): Krea 2 Community License v1 — use, copy, distribute and
    # make derivatives allowed (§2.1, §3); commercial use only under $1M yearly
    # revenue (§2.3); anyone deploying it must run content filters (§4.2) →
    # RELEASE-SPEC §6 lists it for licence acceptance before any shared build.
    # Q8_0 only at 20 GB+ (min 20 makes it "Too big" below, so the Q5_K_S is picked).
    download:
      file: Krea-2-Turbo-Q8_0.gguf
      url: https://huggingface.co/realrebelai/KREA-2_GGUFs/resolve/main/TURBO/Krea-2-Turbo-Q8_0.gguf
      sha256: b98b339068e1e26a9bd01f987d9dcae3f4a4913b8c0d571f5ddb068194e8e500
      size_mb: 13626
      vram_gb: { min: 20, recommended: 22 }    # ESTIMATE: 13.6 GB + 4.3 GB encoder + activations
      alt_quants:
        q5_k: { file: Krea-2-Turbo-Q5_K_S.gguf, url: "https://huggingface.co/realrebelai/KREA-2_GGUFs/resolve/main/TURBO/Krea-2-Turbo-Q5_K_S.gguf", sha256: 2d9a6bfb1b9ef512b040af72b59ce8c4a564f834a083747f3a6e7d3781e8b6dd, size_mb: 8819, vram_gb: { min: 12, recommended: 16 } }   # ESTIMATE

  krea2_raw:
    inherits: krea2_turbo
    label: "Krea 2 Raw"
    detect: { same_as: krea2_turbo }
    uses_negative_prompt: true
    dials:
      quality: { fast: 28, balanced: 40, best: 52 }   # README: --steps 52 --cfg 3.5
      cfg_fixed: null
      cfg_range: [2.0, 5.5]
      cfg_default: 3.5

  # ---------------------------------------------------------------- Anima
  # circlestone-labs/Anima README: 2B anime / illustration model; base and
  # aesthetic 30–50 steps CFG 4–5, Turbo CFG 1 and 8–12 steps; tag or natural
  # prompts; recommended prefix / negative below. Engine: AnimaConditioner
  # (Qwen3 0.6B) + the Qwen-Image VAE (docs/anima.md).
  anima:
    label: "Anima"
    style_template: tags
    activation_gb: 1.5
    license_note: "Non-commercial license"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): the LLM adapter → VERSION_ANIMA.
      any_tensor: ["llm_adapter.blocks.0.cross_attn.q_proj.weight"]
    civitai_base_models: ["Anima"]
    layout: diffusion_only
    components: { vae: qwen_image_vae, llm: qwen3_06b_base }
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]           # docs/anima.md
    defaults:
      sampler: euler                    # ComfyUI template: euler, 30 steps, CFG 4
      auto_prompt_prefix: "masterpiece, best quality, score_7, safe, "
      negative_prompt: "worst quality, low quality, score_1, score_2, score_3, artist name, blurry, jpeg artifacts, chromatic aberration"
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 20, balanced: 30, best: 40 }
      cfg_range: [3.0, 6.0]
      cfg_default: 4.0

  anima_turbo:
    inherits: anima
    label: "Anima Turbo"
    detect: { same_as: anima }          # not in CivitAI's list: recognised by hash or picked
    uses_negative_prompt: false
    dials:
      quality: { fast: 8, balanced: 10, best: 12 }
      cfg_fixed: 1.0

  # ---------------------------------------------------------------- Chroma
  # FLUX.1-schnell-derived, T5 only (no CLIP-L), real CFG. ComfyUI Chroma1-HD
  # template: euler, beta scheduler, 26 steps, CFG 3.5, no flow shift (= the
  # engine's default for Flux without guidance_in).
  chroma:
    label: "Chroma"
    style_template: natural
    activation_gb: 2.5
    license_note: "Apache 2.0"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version() says FLUX; model_builders.cpp switches to Chroma on
      # `distilled_guidance_layer`. Chroma Radiance (pixel space) is not registered.
      any_tensor: ["double_blocks.", "single_transformer_blocks."]
      all_of_any:
        - ["distilled_guidance_layer."]
      none_tensor:
        - "double_stream_modulation_img.lin.weight"
        - "nerf_final_layer_conv."
        - "double_blocks.0.img_mlp.gate_proj.weight"
      tensor_ne0: { "^img_in.weight$": 64 }
    civitai_base_models: ["Chroma"]
    layout: diffusion_only
    components: { vae: flux_ae, t5xxl: { vram_gte_24: t5xxl_fp16, else: t5xxl_fp8 } }   # docs/chroma.md
    taesd: taef1
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]      # see sd15
    defaults: { sampler: euler, scheduler: beta }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 16, balanced: 26, best: 36 }
      cfg_range: [2.0, 6.0]
      cfg_default: 3.5

  # ---------------------------------------------------------------- SD 3 / 3.5
  # MMDiT with CLIP-L + CLIP-G + T5 (docs/sd3.md). The checkpoints carry the SD3
  # VAE, so all-in-one. CivitAI currently lists no SD 3.x checkpoints (probe
  # 2026-09-28 returned none for every SD 3.x string); kept for local files / LoRAs.
  sd3:
    label: "Stable Diffusion 3 / 3.5"
    style_template: natural
    activation_gb: 2.5
    license_note: "Stability AI Community License"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `joint_blocks.` → VERSION_SD3.
      any_tensor: ["^joint_blocks."]
    civitai_base_models: ["SD 3", "SD 3.5", "SD 3.5 Large", "SD 3.5 Medium"]
    layout: all_in_one
    components: { clip_l: clip_l, clip_g: clip_g, t5xxl: { vram_gte_24: t5xxl_fp16, else: t5xxl_fp8 } }
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]      # see sd15
    defaults: { sampler: euler }        # ComfyUI template: euler, 20 steps, CFG 4
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 20, balanced: 28, best: 40 }
      cfg_range: [3.0, 7.0]
