# Pinhole model registry
# ---------------------------------------------------------------------------
# Everything Pinhole knows about model families lives here. The app loads this
# file, then deep-merges Data/config/overrides.yaml on top (user wins).
#
# STATUS: first draft. Every `url` and every `sha256: TODO` must be verified
# against the real file before release (see CLAUDE.md → "Registry rules").
# CivitAI baseModel strings must be checked against the live API enums.
# ---------------------------------------------------------------------------

schema_version: 1

