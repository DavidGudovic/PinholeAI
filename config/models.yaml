# What the pinned sd-server can do that changes wiring.
engine_features:
  # sd-server builds its context with tae_preview_only = false
  # (examples/server/main.cpp: ctx_params.to_sd_ctx_params_t(false)), so
  # `--taesd` would REPLACE the VAE for the final image, and the server API has
  # no preview stream. Keep false until the server gains preview-only TAESD;
  # the `taesd:` entries below stay so turning this on needs no other change.
  taesd_preview: false

# How prompt + style are joined at request time (SPEC §7). Never stored.
style_templates:
  natural: "{prompt}. Style: {style}"
  tags: "{prompt}, {style}"

# Shared dial definitions. Families reference or override these.
dial_presets:
  shapes_1024: &shapes_1024
    square:    [1024, 1024]
    portrait:  [832, 1216]
    landscape: [1216, 832]
    wide:      [1344, 768]
  shapes_512: &shapes_512
    square:    [512, 512]
    portrait:  [512, 768]
    landscape: [768, 512]
    wide:      [896, 512]     # multiple of 64 (UNet); 912 would be re-aligned by the engine

families:

  # ---------------------------------------------------------------- SD 1.5
  sd15:
    label: "Stable Diffusion 1.5"
    style_template: tags
    vram_gb: { min: 4, recommended: 6 }        # ESTIMATE — measure before release
    activation_gb: 1.0
    modes: [txt2img, img2img, inpaint]
    detect:
      # get_sd_version(): UNet blocks + a CLIP-L token embedding (ne0 768 → SD1;
      # SD2's OpenCLIP is 1024 and named differently), and no second text encoder
      # (that makes it SDXL). SVD shares the UNet names.
      all_of_any:
        - ["input_blocks.", "unet.down_blocks."]
        - ["text_model.embeddings.token_embedding.weight$"]
      none_tensor: ["conditioner.embedders.1", "cond_stage_model.1", "^te.1.", "input_blocks.8.0.time_mixer.mix_factor"]
      tensor_ne0: { "text_model.embeddings.token_embedding.weight$": 768 }
    civitai_base_models: ["SD 1.5"]
    layout: all_in_one
    components: {}
    taesd: null
    uses_negative_prompt: true
    defaults:
      sampler: dpm++2m
      scheduler: karras
      clip_skip: 1
      negative_prompt: "lowres, blurry, bad anatomy, extra fingers, watermark, text"
    dials:
      shape: *shapes_512
      size_multiple: 64
      quality: { fast: 15, balanced: 25, best: 35 }
      cfg_range: [4.0, 11.0]
      cfg_default: 7.0
      hires_at_best: { enabled: true, scale: 1.5, denoising_strength: 0.45 }

  # Few-step SD 1.5 finetunes (Hyper-SD merges): same files, very different defaults.
  sd15_fast:
    inherits: sd15
    label: "SD 1.5 · Hyper"
    civitai_base_models: ["SD 1.5 Hyper"]
    detect: { same_as: sd15 }
    defaults:
      sampler: euler_a
      scheduler: sgm_uniform
    dials:
      quality: { fast: 4, balanced: 6, best: 8 }
      cfg_range: [1.0, 2.5]
      cfg_default: 1.5
      hires_at_best: { enabled: false }

  # ---------------------------------------------------------------- SDXL (base + generic finetunes)
  sdxl:
    label: "SDXL"
    style_template: tags
    vram_gb: { min: 6, recommended: 10 }       # ESTIMATE (min uses VAE tiling)
    activation_gb: 2.0
    modes: [txt2img, img2img, inpaint]
    detect:
      # get_sd_version(): is_unet && has_multiple_encoders → SDXL (incl. the
      # distilled SSD-1B / Vega and inpaint variants, which run the same way).
      all_of_any:
        - ["input_blocks.", "unet.down_blocks."]
        - ["conditioner.embedders.1", "cond_stage_model.1", "^te.1."]
      none_tensor: ["input_blocks.8.0.time_mixer.mix_factor"]   # SVD
    civitai_base_models: ["SDXL 1.0", "SDXL Distilled"]
    layout: all_in_one
    components:
      vae_override: sdxl_vae_fp16_fix   # avoids black/NaN images in fp16 (docs/sd.md passes --vae too)
    taesd: taesdxl
    uses_negative_prompt: true
    defaults:
      sampler: dpm++2m
      scheduler: karras
      clip_skip: 1
      negative_prompt: "lowres, blurry, bad anatomy, deformed hands, watermark, text"
    dials:
      shape: *shapes_1024
      size_multiple: 64
      quality: { fast: 20, balanced: 30, best: 40 }
      cfg_range: [3.0, 9.0]
      cfg_default: 6.0
      hires_at_best: { enabled: false }

  # Pony / Illustrious / NoobAI are SDXL architecture but want different defaults.
  # Detected via CivitAI baseModel or known hash; header sniffing alone says "sdxl".
  sdxl_pony:
    inherits: sdxl
    label: "SDXL · Pony"
    civitai_base_models: ["Pony"]              # NOT "Pony V7" (different architecture)
    detect: { same_as: sdxl }
    defaults:
      sampler: euler_a
      scheduler: discrete
      clip_skip: 2
      auto_prompt_prefix: "score_9, score_8_up, score_7_up, "   # added at request time, user can disable
      negative_prompt: "score_4, score_5, score_6, lowres, bad anatomy"
    dials:
      cfg_range: [4.0, 8.0]
      cfg_default: 6.0

  sdxl_illustrious:
    inherits: sdxl
    label: "SDXL · Illustrious / NoobAI"
    civitai_base_models: ["Illustrious", "NoobAI"]
    detect: { same_as: sdxl }
    defaults:
      sampler: euler_a
      scheduler: discrete
      clip_skip: 2
      auto_prompt_prefix: "masterpiece, best quality, "
      negative_prompt: "worst quality, low quality, lowres, bad anatomy, bad hands, watermark"
    dials:
      cfg_range: [4.0, 8.0]
      cfg_default: 5.5

  # Few-step SDXL finetunes (Lightning / Hyper / Turbo merges). With the plain
  # SDXL defaults (30 steps, CFG 6) these burn out, so they get their own entry.
  # ("SDXL 1.0 LCM" is left out: it needs the lcm sampler + LCM LoRA workflow.)
  sdxl_fast:
    inherits: sdxl
    label: "SDXL · Lightning / Hyper / Turbo"
    civitai_base_models: ["SDXL Lightning", "SDXL Hyper", "SDXL Turbo"]
    detect: { same_as: sdxl }
    defaults:
      sampler: euler
      scheduler: sgm_uniform
    dials:
      quality: { fast: 4, balanced: 6, best: 8 }
      cfg_range: [1.0, 2.5]
      cfg_default: 1.5

  # ---------------------------------------------------------------- FLUX.1
  flux1_dev:
    label: "FLUX.1 dev"
    style_template: natural
    activation_gb: 2.5                          # no download spec: VRAM estimated from file size (SPEC §6.2)
    license_note: "Non-commercial license"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `double_blocks.` / `single_transformer_blocks.` → Flux,
      # unless it is FLUX.2, Chroma(-Radiance), Ovis, Fill/Controls/Flex.2 (img_in
      # width 384/128/196) or LongCat (txt_in width 3584). dev and Kontext are
      # guidance-distilled (`guidance_in`, flux.hpp guidance_embed); schnell is not.
      any_tensor: ["double_blocks.", "single_transformer_blocks."]
      all_of_any:
        - ["guidance_in.in_layer.weight", "time_text_embed.guidance_embedder."]
      none_tensor:
        - "double_stream_modulation_img.lin.weight"   # FLUX.2
        - "distilled_guidance_layer."                 # Chroma (model_builders.cpp)
        - "nerf_final_layer_conv."                    # Chroma Radiance
        - "double_blocks.0.img_mlp.gate_proj.weight"  # Ovis-Image
      tensor_ne0:
        "^img_in.weight$": 64
        "^txt_in.weight$": 4096
      ambiguous_with: [flux1_kontext]   # same tensors → hash / CivitAI / ask
    civitai_base_models: ["Flux.1 D"]
    layout: diffusion_only
    components: { vae: flux_ae, clip_l: clip_l, t5xxl: { vram_gte_16: t5xxl_fp16, else: t5xxl_fp8 } }
    taesd: taef1
    uses_negative_prompt: false
    # No --clip-on-cpu: it is deprecated (common.cpp "use --backend te=cpu") and
    # auto-fit (on by default) already parks T5 in RAM when VRAM is short while
    # still encoding on the GPU, which is much faster than CPU encoding.
    flags: []
    # `flux` = the engine's own default for Flux (resolution-aware shift,
    # default_scheduler() in src/pipeline/request.cpp).
    defaults: { sampler: euler, scheduler: flux, guidance: 3.5 }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 16, balanced: 24, best: 32 }
      cfg_fixed: 1.0                            # docs/flux.md: --cfg-scale 1.0
      stick_to_prompt_maps_to: guidance
      guidance_range: [2.0, 5.0]

  flux1_schnell:
    inherits: flux1_dev
    label: "FLUX.1 schnell"
    license_note: "Apache 2.0"
    civitai_base_models: ["Flux.1 S"]
    detect:
      # Same as dev but WITHOUT the guidance embedder.
      all_of_any: []
      none_tensor:
        - "double_stream_modulation_img.lin.weight"
        - "distilled_guidance_layer."
        - "nerf_final_layer_conv."
        - "double_blocks.0.img_mlp.gate_proj.weight"
        - "guidance_in."
        - "time_text_embed.guidance_embedder."
      ambiguous_with: []
    defaults: { guidance: null }                # not guidance-distilled
    dials:
      quality: { fast: 2, balanced: 4, best: 6 } # docs/flux.md: --steps 4
      stick_to_prompt_maps_to: null
      guidance_range: null

  # ---------------------------------------------------------------- Z-Image
  z_image_turbo:
    label: "Z-Image Turbo"
    style_template: natural
    activation_gb: 2.0
    license_note: "Apache 2.0"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `cap_embedder.0.weight` → Z-Image, unless the file also
      # carries Ming-Image's LLM connector.
      any_tensor: ["cap_embedder.0.weight"]
      none_tensor: ["text_encoders.llm.connector.layers.0.self_attn.q_proj.weight"]
      ambiguous_with: [z_image_base]
    civitai_base_models: ["ZImageTurbo"]
    layout: diffusion_only
    components: { vae: flux_ae, llm: qwen3_4b }   # docs/z_image.md
    taesd: taef1
    uses_negative_prompt: false
    flags: ["--diffusion-fa"]                     # docs/z_image.md
    defaults: { sampler: euler, scheduler: simple }
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 6, balanced: 8, best: 10 } # docs/z_image.md: --steps 8
      cfg_fixed: 1.0                              # docs/z_image.md: --cfg-scale 1.0
    download:
      file: z_image_turbo_bf16.safetensors
      url: https://huggingface.co/Comfy-Org/z_image_turbo/resolve/main/split_files/diffusion_models/z_image_turbo_bf16.safetensors
      sha256: 2407613050b809ffdff18a4ac99af83ea6b95443ecebdf80e064a79c825574a6
      size_mb: 12310
      vram_gb: { min: 12, recommended: 16 }    # ESTIMATE, text encoder offloaded to RAM by auto-fit
      alt_quants:        # best quant that fits is picked automatically (bf16 → q8 → q4)
        q8_0: { file: z_image_turbo-Q8_0.gguf, url: "https://huggingface.co/leejet/Z-Image-Turbo-GGUF/resolve/main/z_image_turbo-Q8_0.gguf", sha256: df1c5baa86d1398c979495a6072dbcee79444fdb884a2445582ba0769c44e9a1, size_mb: 6577, vram_gb: { min: 8, recommended: 12 } }
        q4_k: { file: z_image_turbo-Q4_K.gguf, url: "https://huggingface.co/leejet/Z-Image-Turbo-GGUF/resolve/main/z_image_turbo-Q4_K.gguf", sha256: 14b375ab4f226bc5378f68f37e899ef3c2242b8541e61e2bc1aff40976086fbd, size_mb: 3864, vram_gb: { min: 5, recommended: 8 } }

  z_image_base:
    inherits: z_image_turbo
    label: "Z-Image"
    civitai_base_models: ["ZImageBase"]
    detect:
      ambiguous_with: [z_image_turbo]
    uses_negative_prompt: true
    dials:
      quality: { fast: 20, balanced: 30, best: 40 }
      cfg_fixed: null
      cfg_range: [3.0, 7.0]
      cfg_default: 5.0                            # docs/z_image.md: --cfg-scale 5.0

  # ---------------------------------------------------------------- Qwen-Image
  # Qwen-Image (txt2img) and Qwen-Image-Edit share every tensor name
  # (VERSION_QWEN_IMAGE for both); CivitAI files both under "Qwen".
  qwen_image:
    label: "Qwen-Image"
    style_template: natural
    activation_gb: 3.0
    license_note: "Apache 2.0"
    modes: [txt2img, img2img]
    detect:
      # get_sd_version(): `transformer_blocks.0.img_mod.1.weight` → Qwen-Image,
      # except Mage-Flow (img_in width 128), Qwen-Image-Layered (addition_t_embedding),
      # Lens (img_mlp.w1) and Qwen-Image 2.1 (txt_in.text_norm).
      any_tensor: ["transformer_blocks.0.img_mod.1.weight"]
      none_tensor:
        - "time_text_embed.addition_t_embedding.weight"
        - "transformer_blocks.0.img_mlp.w1.weight"
        - "^txt_in.text_norm.weight$"
      tensor_ne0: { "^img_in.weight$": 64 }
      ambiguous_with: [qwen_image_edit_2511]
    civitai_base_models: ["Qwen"]
    layout: diffusion_only
    components: { vae: qwen_image_vae, llm: qwen25_vl_7b_q8 }   # docs/qwen_image.md
    uses_negative_prompt: true
    flags: ["--diffusion-fa"]                     # docs/qwen_image.md
    defaults: { sampler: euler, flow_shift: 3.0 } # docs/qwen_image.md: --flow-shift 3
    dials:
      shape: *shapes_1024
      size_multiple: 16
      quality: { fast: 12, balanced: 20, best: 30 }
      cfg_range: [1.5, 4.0]
      cfg_default: 2.5                            # docs/qwen_image.md: --cfg-scale 2.5

  # ---------------------------------------------------------------- Edit models
  qwen_image_edit_2511:
    label: "Qwen Image Edit 2511"
    style_template: natural
    activation_gb: 3.0
    license_note: "Apache 2.0"
    role: edit                     # used by the Edit tab's instruction mode
    edit_priority: 1               # preferred edit model when it fits
    modes: [edit]
    detect:
      same_as: qwen_image
      # ComfyUI's 2511 files carry this marker; qwen_image.hpp then turns on
      # zero_cond_t by itself.
      decisive_tensor: ["__index_timestep_zero__"]
    civitai_base_models: ["Qwen"]  # CivitAI does not split Image vs Image-Edit
    layout: diffusion_only
    components: { vae: qwen_image_vae, llm: qwen25_vl_7b_q8, llm_vision: qwen25_vl_7b_mmproj }
    uses_negative_prompt: false
    # docs/qwen_image_edit.md: 2511 "must" run with qwen_image_zero_cond_t=true or
    # edit quality degrades badly (parsed in qwen_image.hpp QwenImageRunner).
    flags: ["--diffusion-fa", "--model-args", "qwen_image_zero_cond_t=true"]
    defaults: { sampler: euler, flow_shift: 3.0 } # docs/qwen_image_edit.md
    dials:
      shape: *shapes_1024          # used when no reference size is given
      size_multiple: 16
      quality: { fast: 12, balanced: 20, best: 30 }
      cfg_range: [1.5, 4.0]
      cfg_default: 2.5             # docs/qwen_image_edit.md: --cfg-scale 2.5
      stay_close_maps_to: cfg      # "Stay close to original" dial (strict = lower CFG)
    download:
      file: qwen-image-edit-2511-Q4_K_M.gguf
      url: https://huggingface.co/unsloth/Qwen-Image-Edit-2511-GGUF/resolve/main/qwen-image-edit-2511-Q4_K_M.gguf
      sha256: 8677bac90627adbbc11efab87b1870e701c4eb3689ee865a3de8ab81b705a723
      size_mb: 13245
      vram_gb: { min: 12, recommended: 16 }    # ESTIMATE, weights partly in RAM (auto-fit)

  flux1_kontext:
    label: "FLUX.1 Kontext"
    style_template: natural
    activation_gb: 2.5
    license_note: "Non-commercial license"
    role: edit
    edit_priority: 2               # fallback for lower VRAM
    modes: [edit]
    detect: { same_as: flux1_dev }
    civitai_base_models: ["Flux.1 Kontext"]
    layout: diffusion_only
    components: { vae: flux_ae, clip_l: clip_l, t5xxl: t5xxl_fp8 }   # docs/kontext.md
    uses_negative_prompt: false
    flags: []                      # see flux1_dev about --clip-on-cpu
    defaults: { sampler: euler, scheduler: flux, guidance: 2.5 }
    dials:
      shape: *shapes_1024          # used when no reference size is given
