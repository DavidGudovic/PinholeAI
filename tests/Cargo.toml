pinhole-registry = { workspace = true }
pinhole-engine = { workspace = true, features = ["test-util"] }
tokio = { workspace = true }
tempfile = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
png = { workspace = true }
