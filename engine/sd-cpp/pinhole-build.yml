# Builds the patched sd-server for Pinhole. Lives in Pinhole's PUBLIC fork of
# leejet/stable-diffusion.cpp, NOT in PinholeAI: public repos get free Actions minutes,
# Windows included. Copy it to the fork's default branch as .github/workflows/pinhole-build.yml
# (GitHub only offers "Run workflow" for workflows on the default branch), next to
# pinhole/*.patch (see engine/sd-cpp/README.md).
#
# Actions → Pinhole engine build → Run workflow (upstream tag, release tag). It checks out
# upstream stable-diffusion.cpp at the tag, applies every pinhole/*.patch, builds the same
# variants Pinhole pins today plus Linux CUDA, and publishes one release with all zips and
# SHA256SUMS.txt. The web UI is left out (the lock-down flag disables it anyway).
#
# Build flags follow upstream's .github/workflows/build.yml at master-929-3f8527a.
# Not run yet: first run needs checking against upstream's own job logs.

name: Pinhole engine build

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "Upstream stable-diffusion.cpp tag (e.g. master-929-3f8527a)"
        required: true
        default: master-929-3f8527a
      release_tag:
        description: "Release tag to create (e.g. master-929-3f8527a-pinhole1)"
        required: true
        default: master-929-3f8527a-pinhole1

permissions:
  contents: write

env:
  UPSTREAM: leejet/stable-diffusion.cpp
  COMMON_FLAGS: -DGGML_NATIVE=OFF -DSD_BUILD_SHARED_LIBS=ON -DSD_BUILD_SHARED_GGML_LIB=ON -DGGML_BACKEND_DL=ON -DGGML_CPU_ALL_VARIANTS=ON -DSD_SERVER_BUILD_FRONTEND=OFF

jobs:
  linux:
    runs-on: ubuntu-24.04 # glibc 2.39; Pinhole's engine.yaml says min_glibc 2.38
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: cpu
            flags: ""
          - build: vulkan
            flags: -DSD_VULKAN=ON
          # Linux CUDA (upstream ships none). Only recent NVIDIA cards, to keep the
          # download small: 86 = RTX 30xx, 89 = RTX 40xx, 120 = RTX 50xx (Blackwell).
          # Older cards keep using the Vulkan build.
          - build: cuda12
            flags: -DSD_CUDA=ON "-DCMAKE_CUDA_ARCHITECTURES=86;89;120"
    steps:
      - uses: actions/checkout@v4
        with:
          path: pinhole
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref }}
          submodules: recursive
          path: src
      - name: Apply Pinhole patches
        working-directory: src
        run: for p in ../pinhole/pinhole/*.patch; do git apply --verbose "$p"; done
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential zip libvulkan-dev glslc spirv-headers
      - name: CUDA toolkit
        if: matrix.build == 'cuda12'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cudart-dev", "cccl"]'
          non-cuda-sub-packages: '["libcublas", "libcublas-dev"]'
      - name: Build
        working-directory: src
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release ${{ env.COMMON_FLAGS }} ${{ matrix.flags }} \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_INSTALL_RPATH='$ORIGIN'
          cmake --build build --config Release -j "$(nproc)"
      - name: Check the patch is in
        # The CUDA build links libcuda.so.1, which only comes with an NVIDIA driver (not on
        # the runner), so it can't start here: look for the option text in the binary instead.
        run: |
          if [ "${{ matrix.build }}" = cuda12 ]; then
            grep -a -- --reject-origin src/build/bin/sd-server > /dev/null
          else
            src/build/bin/sd-server --help | grep -- --reject-origin > /dev/null
          fi
      - name: Pack
        run: |
          cp src/ggml/LICENSE src/build/bin/ggml.txt
          cp src/LICENSE src/build/bin/stable-diffusion.cpp.txt
          zip -j "sd-${{ inputs.release_tag }}-bin-Linux-Ubuntu-24.04-x86_64-${{ matrix.build }}.zip" src/build/bin/*
      - name: Pack CUDA runtime (next to sd-server, like upstream's Windows cudart zip)
        if: matrix.build == 'cuda12'
        run: |
          mkdir cudart
          lib="$CUDA_PATH/targets/x86_64-linux/lib"
          cp -L "$lib"/libcudart.so.12 "$lib"/libcublas.so.12 "$lib"/libcublasLt.so.12 cudart/
          zip -j "cudart-sd-bin-Linux-Ubuntu-24.04-x86_64-cu12.zip" cudart/*
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.build }}
          path: "*.zip"

  windows:
    runs-on: windows-2022
    env:
      VULKAN_VERSION: 1.4.328.1
    strategy:
      fail-fast: false
      matrix:
        include:
          - build: cpu
            flags: ""
          - build: vulkan
            flags: -DSD_VULKAN=ON
          # Same architectures as upstream's Windows CUDA build (GTX 10xx and newer).
          - build: cuda12
            flags: -DSD_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES='61;70;75;80;86;89;90;100;120' -DCMAKE_CUDA_FLAGS='-Xcudafe "--diag_suppress=177" -Xcudafe "--diag_suppress=550"'
    steps:
      - uses: actions/checkout@v4
        with:
          path: pinhole
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM }}
          ref: ${{ inputs.upstream_ref }}
          submodules: recursive
          path: src
      - name: Apply Pinhole patches
        working-directory: src
        shell: bash
        run: for p in ../pinhole/pinhole/*.patch; do git apply --verbose "$p"; done
      - name: CUDA toolkit
        id: cuda-toolkit
        if: matrix.build == 'cuda12'
        uses: Jimver/cuda-toolkit@v0.2.22
        with:
          cuda: "12.8.1"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "thrust", "visual_studio_integration"]'
      - name: Vulkan SDK
        if: matrix.build == 'vulkan'
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build
        working-directory: src
        run: |
          cmake -B build -DCMAKE_CXX_FLAGS='/bigobj' -G Ninja -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe -DCMAKE_BUILD_TYPE=Release ${{ env.COMMON_FLAGS }} ${{ matrix.flags }}
          cmake --build build
      - name: Check the patch is in
        # The CUDA build needs nvcuda.dll from an NVIDIA driver (not on the runner) to start,
        # so look for the option text in the binary instead.
        shell: bash
        run: |
          if [ "${{ matrix.build }}" = cuda12 ]; then
            grep -a -- --reject-origin src/build/bin/sd-server.exe > /dev/null
          else
            src/build/bin/sd-server.exe --help | grep -- --reject-origin > /dev/null
          fi
      - name: Pack
        run: |
          Copy-Item src/ggml/LICENSE src/build/bin/ggml.txt
          Copy-Item src/LICENSE src/build/bin/stable-diffusion.cpp.txt
          7z a "sd-${{ inputs.release_tag }}-bin-win-${{ matrix.build }}-x64.zip" .\src\build\bin\*
      - name: Pack CUDA runtime
        if: matrix.build == 'cuda12'
        run: |
          robocopy "${{ steps.cuda-toolkit.outputs.CUDA_PATH }}\bin" cudart cudart64_*.dll cublas64_*.dll cublasLt64_*.dll
          if ($LASTEXITCODE -ge 8) { exit 1 }  # robocopy: 0-7 = success
          7z a cudart-sd-bin-win-cu12-x64.zip .\cudart\*
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.build }}
          path: "*.zip"

  release:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -l
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ inputs.release_tag }}" out/* \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "${{ inputs.release_tag }}" \
            --notes "stable-diffusion.cpp ${{ inputs.upstream_ref }} + Pinhole patches (sd-server --api-key / SD_API_KEY, --reject-origin). Built by this workflow."
