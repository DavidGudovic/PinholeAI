[workspace]
resolver = "3"
members = [
  "src-tauri",
  "src-tauri/crates/pinhole-registry",
  "src-tauri/crates/pinhole-net",
  "src-tauri/crates/pinhole-store",
  "src-tauri/crates/pinhole-hardware",
  "src-tauri/crates/pinhole-engine",
  "src-tauri/crates/pinhole-catalog",
  "src-tauri/crates/pinhole-core",
  "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
# internal
pinhole-registry = { path = "src-tauri/crates/pinhole-registry" }
pinhole-net = { path = "src-tauri/crates/pinhole-net" }
pinhole-store = { path = "src-tauri/crates/pinhole-store" }
pinhole-hardware = { path = "src-tauri/crates/pinhole-hardware" }
pinhole-engine = { path = "src-tauri/crates/pinhole-engine" }
pinhole-catalog = { path = "src-tauri/crates/pinhole-catalog" }
pinhole-core = { path = "src-tauri/crates/pinhole-core" }

# external (boring, well-maintained)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util", "net"] }
tokio-util = "0.7"
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream", "http2"] }
url = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
fs2 = "0.4"
tempfile = "3"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rand = "0.9"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
png = "0.17"
zip = { version = "2", default-features = false, features = ["deflate"] }
keyring = "3"
sysinfo = { version = ">=0.36, <0.40", default-features = false, features = ["system", "disk"] }
async-trait = "0.1"
semver = "1"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
